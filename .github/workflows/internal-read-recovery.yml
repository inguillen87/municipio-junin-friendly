name: Internal read recovery
on:
  push:
    branches: ['internal-read-timeout-recovery-20260923', 'master']
    paths:
      - 'api/internal-data.js'
      - 'lib/internal-payroll-document-batch.js'
      - 'assets/payroll-document-batch*'
      - 'tests/payroll-document-batch.test.js'
      - 'tests/fixtures/payroll-document-selection-synthetic.js'
      - 'scripts/verify-payroll-document-selection-browser.mjs'
      - 'scripts/verify-payroll-selection-postgres.mjs'
      - 'centro-acciones.html'
      - 'assets/action-command-recovery.js'
      - 'assets/action-calendar-date.js'
      - 'assets/action-workspace-layout.css'
      - 'tests/action-command-recovery.test.js'
      - 'tests/fixtures/action-command-recovery-synthetic.js'
      - 'scripts/verify-action-command-recovery-browser.mjs'
      - 'lib/internal-budget-payroll.js'
      - 'assets/budget-*.js'
      - 'assets/budget-structure.css'
      - 'scripts/verify-budget-cotejo-browser.mjs'
      - 'ausentismo-control.html'
      - 'lib/absence-event-context.js'
      - 'lib/internal-absence-person.js'
      - 'lib/absence-window-sql.js'
      - 'assets/absence-window-model.js'
      - 'tests/absence-window.test.js'
      - 'tests/fixtures/absence-window-synthetic.js'
      - 'scripts/verify-absence-window-postgres.mjs'
      - 'assets/absence-person-*'
      - 'tests/absence-person.test.js'
      - 'tests/absence-complete-report.test.js'
      - 'tests/fixtures/absence-person-synthetic.js'
      - 'assets/clock-dashboard.js'
      - 'assets/workday-panel.js'
      - 'assets/workday-panel-model.js'
      - 'assets/workday-export.js'
      - 'lib/internal-attendance-workdays.js'
      - 'lib/workday-person-context.js'
      - 'tests/workday-person-context.test.js'
      - 'tests/fixtures/workday-person-synthetic.js'
      - 'assets/workday-quick-*.js'
      - 'scripts/verify-time-absence-workspace-browser.mjs'
      - 'tests/time-absence-operational.test.js'
      - 'tests/fixtures/absence-workspace-synthetic.js'
      - 'lib/workforce-operational-scope.js'
      - 'lib/internal-access-gateway.js'
      - 'lib/internal-identity-access.js'
      - 'lib/internal-neon.js'
      - 'lib/internal-resource-access.js'
      - 'assets/workforce-*'
      - 'internal-dashboard.html'
      - 'scripts/build-friendly.mjs'
      - 'scripts/verify-workforce-operations-browser.mjs'
      - 'tests/internal-data-*'
      - 'tests/internal-employees.test.js'
      - 'tests/employee-picker-api-058.test.js'
      - 'tests/native-employee.test.js'
      - 'tests/native-jurisdiction.test.js'
      - 'tests/fixtures/internal-directory-query.js'
      - 'tests/internal-access-gateway.test.js'
      - 'tests/workforce-operations.test.js'
      - 'tests/grh-curated-consumers.test.js'
      - 'tests/fixtures/grh-curated-consumers-installed.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'vercel.json'
      - '.github/workflows/internal-read-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: internal-read-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: selection-qa-only
          POSTGRES_DB: payroll_selection_qa
        options: >-
          --health-cmd "pg_isready -U postgres -d payroll_selection_qa"
          --health-interval 5s --health-timeout 5s --health-retries 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full tests and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          npm run build 2>&1 | tee verification/internal-read-recovery-build.log
      - name: Isolated PostgreSQL selection scope
        run: |
          set -euo pipefail
          node scripts/verify-payroll-selection-postgres.mjs --write-sql=verification/payroll-selection-qa.sql
          docker exec -e PGPASSWORD=selection-qa-only -i ${{ job.services.postgres.id }} psql -X -h 127.0.0.1 -U postgres -d payroll_selection_qa -v ON_ERROR_STOP=1 < verification/payroll-selection-qa.sql | tee verification/payroll-selection-qa.log
      - name: Isolated PostgreSQL absence interval scope
        run: |
          set -euo pipefail
          node scripts/verify-absence-window-postgres.mjs --write-sql=verification/absence-window-qa.sql
          docker exec -e PGPASSWORD=selection-qa-only -i ${{ job.services.postgres.id }} psql -X -h 127.0.0.1 -U postgres -d payroll_selection_qa -v ON_ERROR_STOP=1 < verification/absence-window-qa.sql 2>&1 | tee verification/absence-window-qa.log
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Workforce browser acceptance with intercepted synthetic APIs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-workforce-operations-browser.mjs 2>&1 | tee verification/internal-read-recovery-browser.log
      - name: Time and absence operational workspace
        run: node scripts/verify-time-absence-workspace-browser.mjs
      - name: Budget structure population comparison
        run: node scripts/verify-budget-cotejo-browser.mjs
      - name: Native command receipt and retry acceptance
        run: node scripts/verify-action-command-recovery-browser.mjs
      - name: Payroll document range selection
        run: node scripts/verify-payroll-document-selection-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-read-recovery-${{ github.run_id }}
          path: |
            verification/internal-read-recovery-build.log
            verification/internal-read-recovery-browser.log
            verification/workforce-browser.json
            verification/workforce-desktop-qa.png
            verification/workforce-mobile-qa.png
            verification/time-absence-workspace/
            verification/action-command-recovery/
            verification/budget-cotejo/
            verification/payroll-document-selection/
            verification/payroll-selection-qa.log
            verification/absence-window-qa.log
          retention-days: 7
