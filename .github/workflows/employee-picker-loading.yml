name: Employee picker loading safety
on:
  push:
    branches: ['fix/employee-picker-loading-20260923', 'master']
    paths:
      - 'assets/employee-picker*'
      - 'scripts/verify-employee-picker*'
      - 'tests/employee-picker*'
      - '.github/workflows/employee-picker-loading.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: employee-picker-loading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full tests and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          npm run build 2>&1 | tee verification/picker-loading-build.log
      - run: npx playwright install --with-deps chromium
      - name: Delayed reads and access regression
        run: node scripts/verify-employee-picker-loading.mjs
      - name: Existing individual, agile and sheet workflows
        run: node scripts/verify-employee-picker-058.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: employee-picker-loading-${{ github.run_id }}
          path: |
            verification/picker-loading-build.log
            verification/employee-picker-loading/
            verification/employee-picker-058/
          retention-days: 7
