name: Parameter candidate without Vercel preview
on:
  push:
    branches: ['internal/payroll-parameters-20260916']
permissions:
  contents: read
concurrency:
  group: parameter-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check reviewed source hashes and restore production configuration for tests
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          for (const [file,expected] of Object.entries(JSON.parse(fs.readFileSync('.qa-parameters-manifest.json')))) {
            const b=fs.readFileSync(file); assert.equal(createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex'),expected,file);
          }
          console.log('All seventeen reviewed files match.');
          JS
          git show 14d21542630e504571b5b41be6dacc7b272ac64a:vercel.json > vercel.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full tests and production build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Parameters and existing report/leave browser journeys
        run: |
          node scripts/verify-payroll-parameters-browser.mjs
          node scripts/verify-report-catalog-browser.mjs
          node scripts/verify-report-centre-browser.mjs
          node scripts/verify-leave-workspace-browser.mjs
      - name: Synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parameters-candidate-${{ github.run_id }}
          path: |
            verification/parameters-local/**
            verification/leave-workspace-local*
          retention-days: 3
