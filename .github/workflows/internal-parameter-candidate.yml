name: Parameter clean-build startup evidence without preview
on:
  push:
    branches: ['internal/payroll-parameters-20260916']
    paths: ['.github/workflows/internal-parameter-candidate.yml', '.qa-parameter-probe.mjs']
permissions:
  contents: read
concurrency:
  group: parameter-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          path: meta
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '5a52b8e3f8ba91b7ea2f4fb38f0f38789dade89d'
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Inspect state only after the initial assertion fails
        run: node ../meta/.qa-parameter-probe.mjs
      - name: Existing report and leave acceptance
        run: |
          node scripts/verify-report-catalog-browser.mjs
          node scripts/verify-report-centre-browser.mjs
          node scripts/verify-leave-workspace-browser.mjs
      - name: Synthetic diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parameter-clean-startup-${{ github.run_id }}
          path: app/verification/parameters-local/**
          retention-days: 3
