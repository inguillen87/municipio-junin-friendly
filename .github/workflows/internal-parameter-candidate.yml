name: Clean parameter release acceptance without preview
on:
  push:
    branches: ['internal/payroll-parameters-20260916']
    paths: ['.github/workflows/internal-parameter-candidate.yml']
permissions:
  contents: read
concurrency:
  group: parameter-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Exact clean release: no temporary manifest, diagnostic or Vercel override.
      - uses: actions/checkout@v4
        with:
          ref: '5a52b8e3f8ba91b7ea2f4fb38f0f38789dade89d'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assert exact release and no candidate metadata
        run: |
          test "$(git rev-parse HEAD)" = 5a52b8e3f8ba91b7ea2f4fb38f0f38789dade89d
          test ! -e .qa-parameters-manifest.json
          test ! -e .qa-parameter-probe.mjs
          test ! -e .github/workflows/internal-parameter-candidate.yml
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full tests and exact production build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Parameter, report and leave acceptance
        run: |
          node scripts/verify-payroll-parameters-browser.mjs
          node scripts/verify-report-catalog-browser.mjs
          node scripts/verify-report-centre-browser.mjs
          node scripts/verify-leave-workspace-browser.mjs
      - name: Synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parameters-clean-release-${{ github.run_id }}
          path: |
            verification/parameters-local/**
            verification/leave-workspace-local*
            verification/report-catalog-react-*.json
            verification/report-centre-browser.json
          retention-days: 3
