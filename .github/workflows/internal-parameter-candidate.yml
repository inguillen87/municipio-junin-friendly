name: Read prior parameter regression failure without rebuilding
on:
  push:
    branches: ['internal/payroll-parameters-20260916']
    paths: ['.github/workflows/internal-parameter-candidate.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarize existing failure only, no build or deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const url = 'https://api.github.com/repos/inguillen87/municipio-junin-friendly/actions/jobs/104724859035/logs';
          const response = await fetch(url, {headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}, signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw Error('Prior log unavailable HTTP '+response.status);
          const text=await response.text();
          console.log(text.split('\n').filter(line=>!line.includes('GH_TOKEN')).slice(-95).join('\n').slice(-10000));
          console.log('Read existing run only. No application tests, dependencies, records, commits or deployments created by this job.');
          JS
