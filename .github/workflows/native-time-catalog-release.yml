name: Native time catalog release
on:
  pull_request:
    branches: ['master']
    paths: ['scripts/migrations/116-*', 'scripts/lib/native-time-catalog*', 'scripts/prepare-native-time-catalog.mjs', 'scripts/verify-native-time-catalog-sql.mjs', 'tests/native-time-catalog*', '.github/workflows/native-time-catalog-release.yml']
  push:
    branches: ['codex/native-time-catalog-20261002', 'master']
    paths: ['scripts/migrations/116-*', 'scripts/lib/native-time-catalog*', 'scripts/prepare-native-time-catalog.mjs', 'scripts/verify-native-time-catalog-sql.mjs', 'tests/native-time-catalog*', '.github/workflows/native-time-catalog-release.yml']
permissions:
  contents: read
concurrency:
  group: native-time-catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: native_time_catalog_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: native_time_qa_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d native_time_catalog_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:native_time_qa_only@127.0.0.1:5432/native_time_catalog_qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE ROLE municontrol_actions_runtime_app;'
      - run: node scripts/verify-native-time-catalog-sql.mjs --ci --expected-major=${{ matrix.postgres }} --require-concurrency --write-sql=verification/native-time.sql --write-lock-sql=verification/native-time-lock.sql
      - name: Native and GRH coexistence with independent work-period lock
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f verification/native-time-lock.sql > verification/native-time-lock.log 2>&1 &
          blocker=$!
          trap 'kill "$blocker" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..100}; do
            if grep -q 'FIXED_NOVELTIES_QA_LOCK_READY' verification/native-time-lock.log; then ready=true; break; fi
            if ! kill -0 "$blocker" 2>/dev/null; then cat verification/native-time-lock.log; exit 1; fi
            sleep 0.1
          done
          test "$ready" = true
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f verification/native-time.sql
          wait "$blocker"
          trap - EXIT
