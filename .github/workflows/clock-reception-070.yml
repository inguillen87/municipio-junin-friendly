name: Clock reception and fleet UI - no previews
on:
  push:
    branches: ['internal-clock-reception-070-20260917', 'internal-clock-fleet-ui-20260917', 'master']
    paths:
      - 'api/attendance-zk40.js'
      - 'lib/internal-zk40-reception.js'
      - 'api/internal-clock-fleet.js'
      - 'lib/internal-clock-fleet.js'
      - 'assets/clock-fleet-*'
      - 'local-agents/clock-fleet/**'
      - 'local-agents/pm10/tests/fleet-*.test.mjs'
      - 'scripts/install-fleet-capture-release.mjs'
      - 'scripts/verify-fleet-local-panel.mjs'
      - 'assets/attendance-point-label.js'
      - 'lib/attendance-point-naming.js'
      - 'data/junin-clock-site-crosswalk.v1.json'
      - 'tests/attendance-point-naming.test.js'
      - 'scripts/build-clock-fleet.mjs'
      - 'scripts/verify-clock-fleet-*.mjs'
      - 'scripts/verify-clock-map-browser.mjs'
      - 'scripts/migrations/070-zk40-multiclock-reception.sql'
      - 'tests/zk40*'
      - 'tests/clock-fleet-production.test.js'
      - '.github/workflows/clock-reception-070.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clock-reception-070-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Existing collector regressions
        run: node --test local-agents/pm10/tests/*.test.mjs
      - name: Existing and new browser journeys - synthetic municipal APIs
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-clock-fleet-browser.mjs
          node scripts/verify-clock-map-browser.mjs
          node scripts/verify-pm10-reception-browser.mjs
          node scripts/verify-continuous-workdays-browser.mjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clock-fleet-validation
          path: |
            verification/clock-fleet/
            verification/clock-map/
          retention-days: 5
  publication:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture recovery and local queue regression
        run: node --test local-agents/pm10/tests/*.test.mjs
      - name: Build expected assets once - full regression already required before promotion
        run: node scripts/build-friendly.mjs
      - name: Published artifact equality and anonymous boundaries
        run: node scripts/verify-clock-fleet-publication.mjs
      - name: Published navigation with synthetic API data
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-clock-fleet-browser.mjs --published
          node scripts/verify-fleet-local-panel.mjs
      - name: Publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clock-fleet-production-check
          path: |
            verification/clock-fleet/
            verification/fleet-local-panel/
          retention-days: 5
