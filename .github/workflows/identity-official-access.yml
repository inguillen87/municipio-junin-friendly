name: Institutional access origin recovery
on:
  pull_request:
    paths: ['login.html', 'assets/access-portal.css', 'api/internal-identity.js', 'tests/internal-identity*', 'scripts/verify-identity-service-feedback-browser.mjs', '.github/workflows/identity-official-access.yml']
  push:
    branches: ['master']
    paths: ['login.html', 'assets/access-portal.css', 'api/internal-identity.js', 'tests/internal-identity*', 'scripts/verify-identity-service-feedback-browser.mjs', '.github/workflows/identity-official-access.yml']
permissions:
  contents: read
concurrency:
  group: identity-official-access-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx --no-install playwright install-deps chromium
      - name: Use the existing project browser admitted for release verification
        run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Production link, origin guard and desktop/mobile access feedback
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-identity-service-feedback-browser.mjs > verification/identity-official-access-proof.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: identity-official-access-${{ github.sha }}
          path: verification/identity-official-access-proof.json
          if-no-files-found: error
