name: Native salary definitions integration
on:
  push:
    branches: ['codex/native-salary-definitions-20261002', 'master']
    paths: ['assets/native-salary*', 'api/internal-native-salary.js', 'lib/internal-native-salary.js', 'src/islands/NativeSalaryCatalog.jsx', 'src/islands/PayrollParameters.jsx', 'nomina-control.html', 'scripts/migrations/112-*', 'scripts/verify-native-salary*', 'tests/native-salary*', 'tests/fixtures/native-salary-synthetic.js', '.vercelignore', '.github/workflows/native-salary-release.yml']
  pull_request:
    branches: ['master', 'codex/native-leave-workflow-20261001']
    paths: ['assets/native-salary*', 'api/internal-native-salary.js', 'lib/internal-native-salary.js', 'src/islands/NativeSalaryCatalog.jsx', 'src/islands/PayrollParameters.jsx', 'nomina-control.html', 'scripts/migrations/112-*', 'scripts/verify-native-salary*', 'tests/native-salary*', 'tests/fixtures/native-salary-synthetic.js', '.vercelignore', '.github/workflows/native-salary-release.yml']
permissions:
  contents: read
concurrency:
  group: native-salary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-native-salary-browser.mjs
      - run: node scripts/verify-payroll-catalog-activation-browser.mjs
      - run: node scripts/verify-payroll-parameters-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-salary-browser-${{ github.run_id }}
          path: verification/native-salary-browser/**
          retention-days: 3
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: native_employment_lifecycle_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: native_lifecycle_qa_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d native_employment_lifecycle_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:native_lifecycle_qa_only@127.0.0.1:5432/native_employment_lifecycle_qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE ROLE municontrol_actions_runtime_app;'
      - run: node scripts/verify-native-salary-sql.mjs --ci --expected-major=${{ matrix.postgres }} --require-concurrency --write-sql=verification/native-salary.sql --write-lock-sql=verification/native-salary-lock.sql
      - name: Real PostgreSQL authority, complete definitions and independent lock
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f verification/native-salary-lock.sql > verification/native-salary-lock.log 2>&1 &
          blocker=$!
          trap 'kill "$blocker" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..100}; do
            if grep -q 'FIXED_NOVELTIES_QA_LOCK_READY' verification/native-salary-lock.log; then ready=true; break; fi
            if ! kill -0 "$blocker" 2>/dev/null; then cat verification/native-salary-lock.log; exit 1; fi
            sleep 0.1
          done
          test "$ready" = true
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f verification/native-salary.sql
          wait "$blocker"
          trap - EXIT
