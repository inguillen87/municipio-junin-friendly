name: Own agreement working time
on:
  pull_request:
    paths: ['assets/own-agreement-working-time*', 'assets/own-payroll-program*', 'assets/own-payroll-run-model.js', 'assets/payroll-navigation.js', 'api/internal-own-agreement-working-time.js', 'api/internal-own-period-classification.js', 'tests/own-period-classification-api.test.js', 'tests/own-period-read-recovery-delay.test.js', 'scripts/install-project-chromium.mjs', 'scripts/lib/project-chromium.mjs', 'scripts/lib/patched-chromium-diagnostic-manifest.mjs', 'scripts/lib/own-synthetic-browser.mjs', 'lib/internal-own-agreement-working-time.js', 'lib/own-payroll-approved-input.js', 'lib/internal-own-payroll-run.js', 'lib/own-period-read-recovery.js', 'scripts/verify-own-agreement-working-time.mjs', 'scripts/lib/own-program-browser-assets.mjs', 'tests/own-program-browser-foundation-qa.test.js', 'scripts/verify-agreement-hours-independent.mjs', 'scripts/build-friendly.mjs', 'scripts/lib/own-agreement-working-time*', 'scripts/lib/own-period-classification*', 'scripts/lib/own-payroll-administrative-operator*', 'scripts/lib/noelia-circuit-runtime.mjs', 'scripts/lib/classification-registration-use*', 'scripts/lib/adoption-administrative-identity-installation.mjs', 'scripts/migrations/167-classification-registration-use.sql', 'scripts/migrations/176-own-payroll-administrative-operator.sql', 'scripts/migrations/177-own-period-classification.sql', 'scripts/migrations/179-own-agreement-working-time.sql', 'scripts/migrations/180-own-agreement-working-time-program.sql', 'tests/own-agreement-working-time*', 'tests/agreement-hours-independent-qa.test.js', 'tests/fixtures/own-agreement-working-time*', 'package.json', 'package-lock.json', '.vercelignore', '.github/workflows/own-agreement-working-time.yml']
  push:
    branches: ['master']
    paths: ['assets/own-agreement-working-time*', 'assets/own-payroll-program*', 'assets/own-payroll-run-model.js', 'assets/payroll-navigation.js', 'api/internal-own-agreement-working-time.js', 'api/internal-own-period-classification.js', 'tests/own-period-classification-api.test.js', 'tests/own-period-read-recovery-delay.test.js', 'scripts/install-project-chromium.mjs', 'scripts/lib/project-chromium.mjs', 'scripts/lib/patched-chromium-diagnostic-manifest.mjs', 'scripts/lib/own-synthetic-browser.mjs', 'lib/internal-own-agreement-working-time.js', 'lib/own-payroll-approved-input.js', 'lib/internal-own-payroll-run.js', 'lib/own-period-read-recovery.js', 'scripts/verify-own-agreement-working-time.mjs', 'scripts/lib/own-program-browser-assets.mjs', 'tests/own-program-browser-foundation-qa.test.js', 'scripts/verify-agreement-hours-independent.mjs', 'scripts/build-friendly.mjs', 'scripts/lib/own-agreement-working-time*', 'scripts/lib/own-period-classification*', 'scripts/lib/own-payroll-administrative-operator*', 'scripts/lib/noelia-circuit-runtime.mjs', 'scripts/lib/classification-registration-use*', 'scripts/lib/adoption-administrative-identity-installation.mjs', 'scripts/migrations/167-classification-registration-use.sql', 'scripts/migrations/176-own-payroll-administrative-operator.sql', 'scripts/migrations/177-own-period-classification.sql', 'scripts/migrations/179-own-agreement-working-time.sql', 'scripts/migrations/180-own-agreement-working-time-program.sql', 'tests/own-agreement-working-time*', 'tests/agreement-hours-independent-qa.test.js', 'tests/fixtures/own-agreement-working-time*', 'package.json', 'package-lock.json', '.vercelignore', '.github/workflows/own-agreement-working-time.yml']
permissions:
  contents: read
concurrency:
  group: agreement-working-time-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Agreement working time / PG${{ matrix.pg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare the existing disposable QA database
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - run: npx --no-install playwright install-deps chromium
      - name: Use the project browser already admitted for release verification
        run: |
          mkdir -p verification
          node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Complete 176/177 foundation and 179/180 rehearsal, installation, durability, replay and desktop/mobile browser
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-own-agreement-working-time.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --browser=chromium --output=verification/agreement-hours-pg${{ matrix.pg }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agreement-hours-pg${{ matrix.pg }}-${{ github.sha }}
          path: |
            verification/agreement-hours-pg${{ matrix.pg }}/result.json
            verification/agreement-hours-pg${{ matrix.pg }}/*proof.json
            verification/agreement-hours-pg${{ matrix.pg }}/partial-checks.json
            verification/agreement-hours-pg${{ matrix.pg }}/failure.txt
            verification/agreement-hours-pg${{ matrix.pg }}/*failure.json
            verification/agreement-hours-pg${{ matrix.pg }}/*.png
            verification/agreement-hours-pg${{ matrix.pg }}/final-adopted-history/result.json
            verification/release-chromium-157.0.8098.0/installation.json
          retention-days: 5
