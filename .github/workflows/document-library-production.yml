name: Document library production verification
on:
  push:
    branches: ['master']
permissions:
  contents: read
concurrency:
  group: document-library-production
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-document-library-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-library-production
          path: verification/document-library-production.json
          retention-days: 5
