name: Own salary seniority
on:
  pull_request:
    paths: ['scripts/install-project-chromium.mjs', 'scripts/lib/project-chromium.mjs', 'scripts/lib/patched-chromium-diagnostic-manifest.mjs', 'scripts/verify-source-preview-fragmented-transport.mjs', 'docs/QA_CHROMIUM_VERIFIED_20261011.md', 'tests/project-chromium-workflow.test.js', 'lib/own-period-read-recovery.js', 'tests/own-period-read-recovery.test.js', 'scripts/lib/own-period-read-contention-qa.mjs', 'api/internal-own-salary-seniority.js', 'assets/own-salary-seniority*', 'assets/own-payroll*.js', 'assets/payroll-navigation.js', 'lib/internal-own-salary-seniority.js', 'lib/own-payroll-approved-input.js', 'lib/internal-own-payroll-run.js', 'scripts/build-friendly.mjs', 'scripts/verify-own-salary-seniority.mjs', 'scripts/verify-salary-auxiliary-namespace.mjs', 'scripts/lib/own-salary-seniority*', 'scripts/lib/salary-auxiliary-namespace-browser.mjs', 'scripts/migrations/156-own-salary-seniority.sql', 'tests/own-salary-seniority*', 'tests/fixtures/own-salary-seniority-synthetic.js', '.github/workflows/own-salary-seniority.yml']
  push:
    branches: ['master']
    paths: ['scripts/install-project-chromium.mjs', 'scripts/lib/project-chromium.mjs', 'scripts/lib/patched-chromium-diagnostic-manifest.mjs', 'scripts/verify-source-preview-fragmented-transport.mjs', 'docs/QA_CHROMIUM_VERIFIED_20261011.md', 'tests/project-chromium-workflow.test.js', 'lib/own-period-read-recovery.js', 'tests/own-period-read-recovery.test.js', 'scripts/lib/own-period-read-contention-qa.mjs', 'api/internal-own-salary-seniority.js', 'assets/own-salary-seniority*', 'assets/own-payroll*.js', 'assets/payroll-navigation.js', 'lib/internal-own-salary-seniority.js', 'lib/own-payroll-approved-input.js', 'lib/internal-own-payroll-run.js', 'scripts/build-friendly.mjs', 'scripts/verify-own-salary-seniority.mjs', 'scripts/verify-salary-auxiliary-namespace.mjs', 'scripts/lib/own-salary-seniority*', 'scripts/lib/salary-auxiliary-namespace-browser.mjs', 'scripts/migrations/156-own-salary-seniority.sql', 'tests/own-salary-seniority*', 'tests/fixtures/own-salary-seniority-synthetic.js', '.github/workflows/own-salary-seniority.yml']
permissions:
  contents: read
concurrency:
  group: own-salary-seniority-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:vercel
      - run: npx playwright install --with-deps chromium
      - run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Prepare disposable PostgreSQL with the original runtime restrictions
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - name: Actual declaration, independent review, exact capture, payroll and mobile UI
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-own-salary-seniority.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --browser=chromium --output=verification/own-salary-seniority-pg${{ matrix.pg }}
      - name: Native fragmented EOF and unchanged rejection guards
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-source-preview-fragmented-transport.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-salary-seniority-pg${{ matrix.pg }}-${{ github.run_id }}
          path: |
            verification/own-salary-seniority-pg${{ matrix.pg }}
            verification/release-chromium-157.0.8098.0/installation.json
            verification/payroll-formula-transport/fragmented-regression
          retention-days: 5
