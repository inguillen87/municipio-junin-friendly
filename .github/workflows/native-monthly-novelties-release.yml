permissions:
  contents: read
concurrency:
  group: native-monthly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-payroll-monthly-decisions-browser.mjs
      - run: node scripts/verify-monthly-approved-annulments-browser.mjs
      - run: node scripts/verify-monthly-approved-corrections-browser.mjs
      - run: node scripts/verify-native-monthly-novelties-browser.mjs
      - run: node scripts/verify-grh-import-browser.mjs
      - run: node scripts/verify-grh-import-login-recovery-browser.mjs
      - run: node scripts/verify-payroll-fixed-novelties-browser.mjs
      - run: node scripts/verify-native-employee-browser.mjs
      - run: node scripts/verify-novelty-batch-controls.mjs
      - run: node scripts/verify-novelty-sheet-057.mjs
      - run: node scripts/verify-novelty-list-057.mjs
      - run: node scripts/verify-novelty-review-056.mjs
      - run: node scripts/verify-attendance-preparte-browser.mjs
      - run: node scripts/verify-employee-picker-058.mjs
      - run: node scripts/verify-employee-picker-loading.mjs
      - run: node scripts/verify-clock-dashboard-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-monthly-browser-${{ github.run_id }}
          path: |
            verification/native-monthly-local/**
            verification/grh-import-browser/**
            verification/monthly-decisions-local/**
            verification/monthly-annul-local/**
            verification/monthly-correction-local/**
          retention-days: 3
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: native_monthly_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: native_monthly_qa_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d native_monthly_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:native_monthly_qa_only@127.0.0.1:5432/native_monthly_qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE ROLE municontrol_actions_runtime_app;'
      - run: node scripts/verify-native-monthly-novelties-sql.mjs --ci --expected-major=${{ matrix.postgres }} --require-concurrency --write-sql=verification/native-monthly.sql --write-lock-sql=verification/native-monthly-lock.sql
      - name: Real PostgreSQL rules and independent command-lock contention
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f verification/native-monthly-lock.sql > verification/native-monthly-lock.log 2>&1 &
          blocker=$!
          trap 'kill "$blocker" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..100}; do
            if grep -q 'FIXED_NOVELTIES_QA_LOCK_READY' verification/native-monthly-lock.log; then
              ready=true
              break
            fi
            if ! kill -0 "$blocker" 2>/dev/null; then
              cat verification/native-monthly-lock.log
              exit 1
            fi
            sleep 0.1
          done
          test "$ready" = true
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f verification/native-monthly.sql
          wait "$blocker"
          trap - EXIT

      - name: Original candidate SQL and atomic import through existing facades
        run: |
          node scripts/verify-grh-import-source-sql.mjs --expected-major=${{ matrix.postgres }} --write-sql=verification/grh-source.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f verification/grh-source.sql
          node scripts/verify-grh-import-atomic-sql.mjs --expected-major=${{ matrix.postgres }} --write-sql=verification/grh-atomic.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f verification/grh-atomic.sql
      - name: Complete monthly decisions, approved annulments and reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-monthly-approved-corrections-sql.mjs --ci --expected-major=${{ matrix.postgres }} --write-sql=verification/monthly-decisions.sql --write-lock-sql=verification/monthly-decisions-lock.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f verification/monthly-decisions-lock.sql > verification/monthly-decisions-lock.log 2>&1 &
          blocker=$!
          trap 'kill "$blocker" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..100}; do
            if grep -q 'FIXED_NOVELTIES_QA_LOCK_READY' verification/monthly-decisions-lock.log; then
              ready=true
              break
            fi
            if ! kill -0 "$blocker" 2>/dev/null; then
              cat verification/monthly-decisions-lock.log
              exit 1
            fi
            sleep 0.1
          done
          test "$ready" = true
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f verification/monthly-decisions.sql
          wait "$blocker"
          trap - EXIT
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, sql]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/build-friendly.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-payroll-monthly-decisions-browser.mjs --published
      - run: node scripts/verify-monthly-approved-annulments-browser.mjs --published
      - run: node scripts/verify-monthly-approved-corrections-browser.mjs --published
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-decisions-production-${{ github.run_id }}
          path: |
            verification/monthly-decisions-published/**
            verification/monthly-annul-published/**
            verification/monthly-correction-published/**
          retention-days: 3
