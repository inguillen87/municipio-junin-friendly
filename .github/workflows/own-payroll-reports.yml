name: Own payroll closed reports
on:
  push:
    branches: ['master', 'codex/own-payroll-reports-20261005']
    paths: ['assets/own-payroll-*', 'assets/payroll-navigation.js', 'assets/report-document.js', 'api/internal-own-payroll-close.js', 'lib/internal-own-payroll-*', 'scripts/*own-payroll*report*.mjs', 'scripts/lib/own-payroll-*', 'tests/own-payroll-report.test.js', 'tests/fixtures/own-payroll-*', 'scripts/build-friendly.mjs', '.github/workflows/own-payroll-reports.yml']
  pull_request:
    paths: ['assets/own-payroll-*', 'assets/payroll-navigation.js', 'assets/report-document.js', 'api/internal-own-payroll-close.js', 'lib/internal-own-payroll-*', 'scripts/*own-payroll*report*.mjs', 'scripts/lib/own-payroll-*', 'tests/own-payroll-report.test.js', 'tests/fixtures/own-payroll-*', 'scripts/build-friendly.mjs', '.github/workflows/own-payroll-reports.yml']
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        major: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.major }}
        env:
          POSTGRES_DB: own_payroll_run_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: own-reports-synthetic-qa
        ports:
          - 554${{ matrix.major }}:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: own-reports-synthetic-qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p verification
      - run: psql -h 127.0.0.1 -p 554${{ matrix.major }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOSUPERUSER NOBYPASSRLS;'
      - run: node --test tests/own-payroll-report.test.js tests/own-payroll-close*.test.js tests/source-report-catalog.test.js tests/payroll-monthly-summary.test.js
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real HTTP and SQL, complete downloads, mobile and revocation
        run: node scripts/verify-own-payroll-report-ui.mjs --major=${{ matrix.major }} --browser=chromium --output=verification/own-reports-ui.json
