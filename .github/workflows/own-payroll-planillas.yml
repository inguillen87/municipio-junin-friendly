name: Own institutional payroll planillas
on:
  push:
    branches: ['master']
    paths: ['assets/own-payroll-*', 'assets/payroll-navigation.js', 'assets/own-bank-output-*', 'assets/annual-position-budget-*', 'scripts/*own-payroll*', 'scripts/lib/**', 'scripts/migrations/**', 'tests/own-payroll-receipt*.test.js', 'tests/fixtures/**', 'scripts/build-friendly.mjs', '.github/workflows/own-payroll-planillas.yml']
  pull_request:
    branches: ['master']
    paths: ['assets/own-payroll-*', 'assets/payroll-navigation.js', 'assets/own-bank-output-*', 'assets/annual-position-budget-*', 'scripts/*own-payroll*', 'scripts/lib/**', 'scripts/migrations/**', 'tests/own-payroll-receipt*.test.js', 'tests/fixtures/**', 'scripts/build-friendly.mjs', '.github/workflows/own-payroll-planillas.yml']
permissions:
  contents: read
jobs:
  planillas:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        major: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.major }}
        env:
          POSTGRES_DB: own_payroll_run_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
        ports:
          - 554${{ matrix.major }}:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: noelia-circuit-synthetic-qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p verification
      - run: psql -h 127.0.0.1 -p 554${{ matrix.major }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOSUPERUSER NOBYPASSRLS;'
      - run: node --test tests/own-payroll-receipt*.test.js tests/own-payroll-close*.test.js
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-own-payroll-receipt-planilla-ui.mjs --major=${{ matrix.major }} --transport=ci --source-commit=${{ github.sha }} --browser=chromium --output=verification/own-planillas-ui.json
