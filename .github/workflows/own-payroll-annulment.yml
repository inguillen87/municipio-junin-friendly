name: Own consolidated payroll annulment
on:
  push:
    branches: ['master', 'codex/consolidated-annulment-20261009']
    paths: ['assets/own-payroll-*', 'assets/payroll-navigation.js', 'api/internal-own-payroll-annulment.js', 'lib/internal-own-payroll-*', 'scripts/*own-payroll-annulment*', 'scripts/lib/own-payroll-*', 'scripts/migrations/146-*', 'tests/own-payroll-annulment*', 'tests/fixtures/own-payroll-*', '.github/workflows/own-payroll-annulment.yml', '.vercelignore']
  pull_request:
    paths: ['assets/own-payroll-*', 'assets/payroll-navigation.js', 'api/internal-own-payroll-annulment.js', 'lib/internal-own-payroll-*', 'scripts/*own-payroll-annulment*', 'scripts/lib/own-payroll-*', 'scripts/migrations/146-*', 'tests/own-payroll-annulment*', 'tests/fixtures/own-payroll-*', '.github/workflows/own-payroll-annulment.yml', '.vercelignore']
permissions:
  contents: read
jobs:
  consolidated-annulment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        major: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.major }}
        env:
          POSTGRES_DB: own_payroll_run_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
        ports:
          - 554${{ matrix.major }}:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: noelia-circuit-synthetic-qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p verification
      - run: psql -h 127.0.0.1 -p 554${{ matrix.major }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOSUPERUSER NOBYPASSRLS;'
      - run: node --test tests/own-payroll-annulment*.test.js tests/own-payroll-liquidation*.test.js tests/own-payroll-run*.test.js tests/own-payroll-individual*.test.js
      - name: Atomic decisions, late failure, exact recovery and real SQL revocation
        run: node scripts/verify-own-payroll-annulment.mjs --major=${{ matrix.major }} --psql=psql --output=verification/annulment-sql.json
      - name: Exact current installation, late rollback, preservation and independent durability
        run: node scripts/verify-own-payroll-annulment-installation.mjs --major=${{ matrix.major }} --source-commit=${{ github.sha }} --transport=ci --output=verification/annulment-installation
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Actual built UI and private HTTP handlers, all pages, mobile and original pending requests
        run: node scripts/verify-own-payroll-annulment-ui.mjs --major=${{ matrix.major }} --psql=psql --browser=chromium --output=verification/annulment-ui.json
