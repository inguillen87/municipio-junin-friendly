name: Municipal owner adoption
on:
  pull_request:
    paths:
      - 'scripts/lib/ci-tested-build.mjs'
      - 'tests/ci-tested-build.test.js'
      - 'scripts/own-art-tested-build.mjs'
      - 'tests/own-art-tested-build.test.js'
      - '.github/workflows/own-art.yml'
      - 'assets/release-status-model.js'
      - 'assets/**'
      - 'api/**'
      - 'lib/**'
      - 'contracts/**'
      - 'tests/**'
      - 'scripts/lib/**'
      - 'scripts/migrations/**'
      - 'scripts/fixtures/**'
      - 'scripts/import-grh-core-canonical.mjs'
      - 'scripts/import-rrhh-neon.mjs'
      - 'scripts/payroll-detail-synthetic.mjs'
      - 'scripts/prepare-own-payroll-installation.mjs'
      - 'scripts/promote-canonical-grh.mjs'
      - 'scripts/verify-agreement-hours-independent.mjs'
      - 'scripts/verify-documentary-roster-performance.mjs'
      - 'scripts/verify-mixed-contract-adoption.mjs'
      - 'scripts/verify-municipal-owner-adoption-authority.mjs'
      - 'scripts/verify-municipal-owner-adoption-decision.mjs'
      - 'scripts/verify-native-employment-catalog-sql.mjs'
      - 'scripts/verify-native-fixed-novelties-sql.mjs'
      - 'scripts/verify-native-jurisdiction-sql.mjs'
      - 'scripts/verify-own-agreement-working-time.mjs'
      - 'scripts/verify-own-contract-salary-conditions.mjs'
      - 'scripts/verify-own-contract-working-time.mjs'
      - 'scripts/verify-own-period-participation.mjs'
      - 'scripts/verify-own-salary-conditions-program.mjs'
      - 'scripts/verify-own-salary-seniority.mjs'
      - 'scripts/verify-payroll-fixed-novelties-sql.mjs'
      - 'scripts/verify-salary-auxiliary-namespace.mjs'
      - 'scripts/build-friendly.mjs'
      - 'scripts/build-charts.mjs'
      - 'src/charts/**'
      - 'scripts/install-project-chromium.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.vercelignore'
      - '.github/workflows/municipal-owner-adoption.yml'
  push:
    branches: ['master']
    paths:
      - 'scripts/lib/ci-tested-build.mjs'
      - 'tests/ci-tested-build.test.js'
      - 'scripts/own-art-tested-build.mjs'
      - 'tests/own-art-tested-build.test.js'
      - '.github/workflows/own-art.yml'
      - 'assets/release-status-model.js'
      - 'assets/**'
      - 'api/**'
      - 'lib/**'
      - 'contracts/**'
      - 'tests/**'
      - 'scripts/lib/**'
      - 'scripts/migrations/**'
      - 'scripts/fixtures/**'
      - 'scripts/import-grh-core-canonical.mjs'
      - 'scripts/import-rrhh-neon.mjs'
      - 'scripts/payroll-detail-synthetic.mjs'
      - 'scripts/prepare-own-payroll-installation.mjs'
      - 'scripts/promote-canonical-grh.mjs'
      - 'scripts/verify-agreement-hours-independent.mjs'
      - 'scripts/verify-documentary-roster-performance.mjs'
      - 'scripts/verify-mixed-contract-adoption.mjs'
      - 'scripts/verify-municipal-owner-adoption-authority.mjs'
      - 'scripts/verify-municipal-owner-adoption-decision.mjs'
      - 'scripts/verify-native-employment-catalog-sql.mjs'
      - 'scripts/verify-native-fixed-novelties-sql.mjs'
      - 'scripts/verify-native-jurisdiction-sql.mjs'
      - 'scripts/verify-own-agreement-working-time.mjs'
      - 'scripts/verify-own-contract-salary-conditions.mjs'
      - 'scripts/verify-own-contract-working-time.mjs'
      - 'scripts/verify-own-period-participation.mjs'
      - 'scripts/verify-own-salary-conditions-program.mjs'
      - 'scripts/verify-own-salary-seniority.mjs'
      - 'scripts/verify-payroll-fixed-novelties-sql.mjs'
      - 'scripts/verify-salary-auxiliary-namespace.mjs'
      - 'scripts/build-friendly.mjs'
      - 'scripts/build-charts.mjs'
      - 'src/charts/**'
      - 'scripts/install-project-chromium.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.vercelignore'
      - '.github/workflows/municipal-owner-adoption.yml'
permissions:
  contents: read
concurrency:
  group: municipal-owner-adoption-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  ART_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  tested_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      manifest_sha: ${{ steps.custody.outputs['manifest-sha'] }}
      artifact_id: ${{ steps.shared_upload.outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refuse ambient database and optional local test inputs
        run: node scripts/lib/ci-tested-build.mjs preflight municipal-owner-adoption
      - name: Complete original general tests and build once for this matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/ci-tested-build-municipal-owner-adoption.log"
      - name: Seal tested public bytes with exact source and current-run identity
        id: custody
        run: node scripts/lib/ci-tested-build.mjs create municipal-owner-adoption
      - name: Upload immutable current-run tested public bytes
        id: shared_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tested-public-municipal-owner-adoption-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-tested-public-municipal-owner-adoption/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5
      - name: Require the immutable uploaded artifact identifier
        shell: bash
        env:
          CI_BUILD_ARTIFACT_ID: ${{ steps.shared_upload.outputs['artifact-id'] }}
        run: |
          set -euo pipefail
          [[ "$CI_BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Preserve complete general build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tested-build-municipal-owner-adoption-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-tested-build-municipal-owner-adoption.log
          if-no-files-found: warn
          retention-days: 5
  verify:
    needs: tested_build
    if: ${{ always() }}
    name: Municipal owner adoption / PG${{ matrix.pg }} / ${{ matrix.baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
        baseline: [pre107, published107]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        # Readiness opens a PostgreSQL client. Probe quickly during startup,
        # then keep the admitted test interval free of periodic probe clients.
        # Every canonical QA transaction still requires its original guard.
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-start-interval 1s --health-start-period 30s --health-interval 1h --health-timeout 5s --health-retries 12
    steps:
      - name: Fail closed when the full-suite producer did not succeed
        if: ${{ always() && (needs.tested_build.result != 'success' || cancelled()) }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require exact producer outputs before downloading
        shell: bash
        env:
          CI_BUILD_ARTIFACT_ID: ${{ needs.tested_build.outputs.artifact_id }}
          CI_BUILD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          [[ "$CI_BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CI_BUILD_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - name: Download only the immutable artifact emitted by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.tested_build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci-tested-public-municipal-owner-adoption
      - name: Verify exact source, runtime, run and every public byte before use
        env:
          CI_BUILD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: node scripts/lib/ci-tested-build.mjs verify municipal-owner-adoption
      - name: Prepare only the disposable synthetic service
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - run: npx --no-install playwright install-deps chromium
      - name: Install the admitted project Chromium before browser use
        run: |
          mkdir -p verification
          node scripts/install-project-chromium.mjs --purpose=release-verification
      # The transport adapter alone is not an executed CI certificate. These
      # commands require the separately reviewed runner integration before push.
      - name: Canonical 184 authority with preserved process and SQL guards
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-municipal-owner-adoption-authority.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --operational-pair-baseline=${{ matrix.baseline }} --output=verification/owner-authority-pg${{ matrix.pg }}-${{ matrix.baseline }}
      - name: Canonical 185 decision and provenance
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-municipal-owner-adoption-decision.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --operational-pair-baseline=${{ matrix.baseline }} --output=verification/owner-decision-pg${{ matrix.pg }}-${{ matrix.baseline }}
      - name: Complete 186 October 01 source, handler and browser circuit
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
          MC_QA_BUSY_DIAGNOSTIC: '1'
        run: node scripts/verify-mixed-contract-adoption.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --operational-pair-baseline=${{ matrix.baseline }} --output=verification/owner-mixed-oct01-pg${{ matrix.pg }}-${{ matrix.baseline }}
      - name: Complete 186 October 14 and canonical 183 four phases
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
          MC_QA_BUSY_DIAGNOSTIC: '1'
        run: node scripts/verify-mixed-contract-adoption.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --operational-pair-baseline=${{ matrix.baseline }} --profile=october14 --output=verification/owner-mixed-oct14-pg${{ matrix.pg }}-${{ matrix.baseline }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: municipal-owner-adoption-pg${{ matrix.pg }}-${{ matrix.baseline }}-${{ github.sha }}
          path: |
            verification/owner-authority-pg${{ matrix.pg }}-${{ matrix.baseline }}/*.json
            verification/owner-authority-pg${{ matrix.pg }}-${{ matrix.baseline }}/*failure.txt
            verification/owner-decision-pg${{ matrix.pg }}-${{ matrix.baseline }}/*.json
            verification/owner-decision-pg${{ matrix.pg }}-${{ matrix.baseline }}/*failure.txt
            verification/owner-mixed-oct01-pg${{ matrix.pg }}-${{ matrix.baseline }}/*.json
            verification/owner-mixed-oct01-pg${{ matrix.pg }}-${{ matrix.baseline }}/*failure.txt
            verification/owner-mixed-oct01-pg${{ matrix.pg }}-${{ matrix.baseline }}/*.png
            verification/owner-mixed-oct14-pg${{ matrix.pg }}-${{ matrix.baseline }}/*.json
            verification/owner-mixed-oct14-pg${{ matrix.pg }}-${{ matrix.baseline }}/*failure.txt
            verification/owner-mixed-oct14-pg${{ matrix.pg }}-${{ matrix.baseline }}/*.png
            verification/release-chromium-157.0.8098.0/installation.json
          retention-days: 5
