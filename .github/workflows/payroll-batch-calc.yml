name: Payroll batch calculation
# «Calcular un convenio completo»: el módulo real en un navegador con servidor simulado (tandas, personas que no se
# liquidan, tanda que falla y se repite, total exacto, escritorio y celular).
on:
  push:
    branches: ['master']
    paths: ['assets/payroll-batch-calc*', 'assets/own-payroll-run-model.js', 'assets/own-payroll-response.js', 'scripts/verify-payroll-batch-calc-browser.mjs', 'tests/payroll-batch-calc.test.js', '.github/workflows/payroll-batch-calc.yml']
  pull_request:
    paths: ['assets/payroll-batch-calc*', 'assets/own-payroll-run-model.js', 'assets/own-payroll-response.js', 'scripts/verify-payroll-batch-calc-browser.mjs', 'tests/payroll-batch-calc.test.js', '.github/workflows/payroll-batch-calc.yml']
permissions:
  contents: read
concurrency:
  group: payroll-batch-calc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test tests/payroll-batch-calc.test.js
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-payroll-batch-calc-browser.mjs --output=verification/payroll-batch-calc-browser.json
