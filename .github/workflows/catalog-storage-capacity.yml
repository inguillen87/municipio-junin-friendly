name: Catalog storage capacity and recovery
on:
  pull_request:
    paths: ['assets/native-employment-catalog*', 'api/internal-employment-catalog.js', 'lib/internal-employment-catalog.js', 'scripts/verify-catalog-storage-capacity.mjs', 'scripts/verify-classification-registration-use.mjs', 'scripts/prepare-catalog-storage-capacity-installation.mjs', 'scripts/lib/catalog-storage-capacity*', 'scripts/migrations/168-catalog-storage-capacity.sql', 'tests/catalog-storage-capacity*', 'tests/native-employment-catalog-recovery*', 'docs/CATALOGO_CAPACIDAD_Y_RECUPERACION.md', 'scripts/build-friendly.mjs', '.vercelignore', '.github/workflows/catalog-storage-capacity.yml']
  push:
    branches: ['master']
    paths: ['assets/native-employment-catalog*', 'api/internal-employment-catalog.js', 'lib/internal-employment-catalog.js', 'scripts/verify-catalog-storage-capacity.mjs', 'scripts/verify-classification-registration-use.mjs', 'scripts/prepare-catalog-storage-capacity-installation.mjs', 'scripts/lib/catalog-storage-capacity*', 'scripts/migrations/168-catalog-storage-capacity.sql', 'tests/catalog-storage-capacity*', 'tests/native-employment-catalog-recovery*', 'docs/CATALOGO_CAPACIDAD_Y_RECUPERACION.md', 'scripts/build-friendly.mjs', '.vercelignore', '.github/workflows/catalog-storage-capacity.yml']
permissions:
  contents: read
concurrency:
  group: catalog-capacity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare the existing disposable QA database
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - run: npx --no-install playwright install-deps chromium
      - name: Use the project browser admitted for release verification
        run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Full existing foundations, exact capacity adaptation, draft recovery and desktop/mobile product
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-catalog-storage-capacity.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --browser=chromium --output=verification/catalog-storage-capacity-pg${{ matrix.pg }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: catalog-storage-capacity-pg${{ matrix.pg }}-${{ github.sha }}
          path: |
            verification/catalog-storage-capacity-pg${{ matrix.pg }}/result.json
            verification/catalog-storage-capacity-pg${{ matrix.pg }}/partial-checks.json
            verification/catalog-storage-capacity-pg${{ matrix.pg }}/failure.txt
            verification/catalog-storage-capacity-pg${{ matrix.pg }}/classification-use-proof.json
            verification/catalog-storage-capacity-pg${{ matrix.pg }}/catalog-storage-capacity-proof.json
            verification/catalog-storage-capacity-pg${{ matrix.pg }}/catalog-capacity-browser-proof.json
            verification/catalog-storage-capacity-pg${{ matrix.pg }}/*.png
          retention-days: 5
