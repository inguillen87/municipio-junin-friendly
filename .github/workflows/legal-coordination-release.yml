name: Legal coordination release
on:
  push:
    branches: ['codex/coordination-core-20260919', 'master']
    paths:
      - 'api/internal-legal-coordination.js'
      - 'assets/legal-coordination*'
      - 'assets/legal-followups-ui.js'
      - 'internal-legal-coordination.html'
      - 'scripts/migrations/081-legal-coordination.sql'
      - 'scripts/verify-coordination-ui.mjs'
      - 'tests/legal-coordination.test.js'
      - '.github/workflows/legal-coordination-release.yml'
permissions:
  contents: read
concurrency:
  group: legal-coordination-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-coordination-ui.mjs
      - run: node scripts/verify-legal-followups-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legal-coordination-${{ github.run_id }}
          path: verification/coordination-ui-local/**
          retention-days: 3