name: Unified municipal clock fleet
on:
  workflow_dispatch:
  push:
    branches: [master, internal-unified-clock-fleet-20260923]
    paths:
      - local-agents/clock-fleet/**
      - local-agents/pm10/**
      - docs/clock-windows-installer/**
      - docs/CLOCK_FLEET_UNIFIED_20260923.md
      - .github/workflows/unified-clock-fleet.yml
permissions:
  contents: read
concurrency:
  group: unified-clock-fleet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test local-agents/pm10/tests/*.test.mjs
