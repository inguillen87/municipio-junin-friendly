name: Unified municipal clock fleet
on:
  workflow_dispatch:
  push:
    branches: [master, internal-unified-clock-fleet-20260923, internal-clock-linux-service-20260923]
    paths:
      - local-agents/clock-fleet/**
      - local-agents/pm10/**
      - docs/clock-windows-installer/**
      - docs/clock-windows11-kit/**
      - docs/CLOCK_FLEET_UNIFIED_20260923.md
      - scripts/build-clock-windows11-kit.mjs
      - tests/clock-linux-installer.test.js
      - tests/clock-windows11-kit.test.js
      - .github/workflows/unified-clock-fleet.yml
permissions:
  contents: read
concurrency:
  group: unified-clock-fleet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify complete PM10 source manifest before regression
        run: node scripts/verify-fleet-local-panel.mjs --manifest-only
      - name: Verify complete fleet source manifest before regression
        run: node --input-type=module -e "import {verifyPm10Manifest} from './scripts/verify-fleet-local-panel.mjs'; console.log(JSON.stringify(verifyPm10Manifest('local-agents/clock-fleet')))"
      - run: node scripts/verify-platform-baseline.mjs
      - run: node scripts/verify-friendly-containment.mjs
      # Keep isolated PDF workers within their production deadline on shared runners.
      - run: node --test --test-concurrency=2 tests/*.test.js
      - run: node scripts/build-friendly.mjs
      - run: node --test --test-concurrency=2 local-agents/pm10/tests/*.test.mjs
      - name: Local shared panel with synthetic status only
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-fleet-local-panel.mjs
