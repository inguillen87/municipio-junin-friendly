name: Legal matters release
on:
  push:
    branches: ['codex/legal-matters-20260920', 'master']
    paths:
      - 'api/internal-legal-matters.js'
      - 'assets/legal-matters*'
      - 'internal-legal-matters.html'
      - 'assets/legal-documentary-panel.js'
      - 'src/islands/legal-registry-entry.tsx'
      - 'scripts/migrations/082-legal-matters.sql'
      - 'scripts/verify-legal-matters-browser.mjs'
      - 'tests/legal-matters.test.js'
      - '.github/workflows/legal-matters-release.yml'
permissions:
  contents: read
concurrency:
  group: legal-matters-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-legal-matters-browser.mjs
      - run: node scripts/verify-legal-followups-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legal-matters-${{ github.run_id }}
          path: verification/legal-matters-local/**
          retention-days: 3