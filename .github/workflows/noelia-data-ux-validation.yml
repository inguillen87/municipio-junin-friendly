name: Noelia data and UX validation
on:
  push:
    branches: ['work/noelia-data-ux-20260923']
    paths:
      - '.github/workflows/noelia-data-ux-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noelia-data-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture reproducible offline engineering workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/offline-workspace
          git archive --format=tar.gz HEAD > verification/offline-workspace/source.tar.gz
          tar -czf verification/offline-workspace/dependencies.tar.gz node_modules
          git rev-parse HEAD > verification/offline-workspace/commit.txt
          sha256sum verification/offline-workspace/*.tar.gz > verification/offline-workspace/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: noelia-offline-workspace-${{ github.run_id }}
          path: verification/offline-workspace/
          retention-days: 1
      - name: Verify baseline without production credentials
        run: npm run build
