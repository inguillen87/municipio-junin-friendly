name: Declared liquidation date compatibility
on:
  push:
    branches: ['master']
    paths: ['assets/own-payroll-*', 'api/internal-own-payroll-run.js', 'lib/internal-own-payroll-run.js', 'scripts/migrations/145-*', 'scripts/*own-payroll-run-date*.mjs', 'scripts/lib/own-payroll-run-date*', 'tests/own-payroll-run-date.test.js', '.github/workflows/own-payroll-run-date.yml']
  pull_request:
    paths: ['assets/own-payroll-*', 'api/internal-own-payroll-run.js', 'lib/internal-own-payroll-run.js', 'scripts/migrations/145-*', 'scripts/*own-payroll-run-date*.mjs', 'scripts/lib/own-payroll-run-date*', 'tests/own-payroll-run-date.test.js', '.github/workflows/own-payroll-run-date.yml']
permissions:
  contents: read
jobs:
  durable-date:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        major: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.major }}
        env:
          POSTGRES_DB: own_payroll_run_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
        ports:
          - 554${{ matrix.major }}:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p verification
      - env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -h 127.0.0.1 -p 554${{ matrix.major }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOSUPERUSER NOBYPASSRLS;'
      - run: node --test tests/own-payroll-run-date.test.js
      - name: Exact upgrade COMMIT, v1 compatibility, v2 dates, annulment, close and revocation
        run: node scripts/verify-own-payroll-run-date.mjs --major=${{ matrix.major }} --transport=ci --source-commit=${{ github.sha }} --output=verification/declared-liquidation-date
