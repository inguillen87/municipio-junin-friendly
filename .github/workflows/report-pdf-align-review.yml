name: PDF report numeric alignment — focused tests
on:
  pull_request:
    paths:
      - 'assets/report-analysis.js'
      - 'assets/own-payroll-report-model.js'
      - 'assets/own-payroll-comparison-model.js'
      - 'assets/position-comparison-model.js'
      - 'assets/payroll-comparison-model.js'
      - 'assets/payroll-source-report-model.js'
      - 'assets/budget-payroll-model.js'
      - 'tests/report-pdf-align.test.js'
      - '.github/workflows/report-pdf-align-review.yml'
permissions:
  contents: read
jobs:
  pdf-report-align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run every affected model and report PDF test (offline)
        run: >
          node --test
          tests/own-payroll-report*.test.js
          tests/own-payroll-comparison.test.js
          tests/position-comparison*.test.js
          tests/budget-payroll-model.test.js
          tests/payroll-comparison-056.test.js
          tests/report-*.test.js
          tests/rrhh-report-pack*.test.js
