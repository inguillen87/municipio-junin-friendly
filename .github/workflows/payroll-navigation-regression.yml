name: Payroll task navigation regression
on:
  push:
    branches: ['master', 'codex/receipt-navigation-regression-20261005']
    paths: ['assets/payroll-navigation.js', 'assets/task-workspace.js', 'assets/payroll-comparison*', 'assets/own-payroll-receipt*', 'nomina-control.html', 'reportes-rrhh.html', 'scripts/verify-payroll-comparison-056.mjs', 'scripts/payroll-comparison-synthetic.mjs', 'scripts/build-friendly.mjs', '.github/workflows/payroll-navigation-regression.yml']
  pull_request:
    paths: ['assets/payroll-navigation.js', 'assets/task-workspace.js', 'assets/payroll-comparison*', 'assets/own-payroll-receipt*', 'nomina-control.html', 'reportes-rrhh.html', 'scripts/verify-payroll-comparison-056.mjs', 'scripts/payroll-comparison-synthetic.mjs', 'scripts/build-friendly.mjs', '.github/workflows/payroll-navigation-regression.yml']
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Full task, downloads, cancellation, keyboard and back navigation
        run: node scripts/verify-payroll-comparison-056.mjs
