name: Own contract working time
on:
  pull_request:
    paths: ['scripts/lib/ci-tested-build.mjs', 'tests/ci-tested-build.test.js', 'scripts/own-art-tested-build.mjs', 'tests/own-art-tested-build.test.js', '.github/workflows/own-art.yml', 'assets/release-status-model.js', '.nvmrc', 'assets/own-contract-working-time*', 'assets/own-salary-seniority*', 'assets/own-collective-jobs*', 'api/internal-own-collective-*', 'lib/own-collective-jobs*', 'scripts/verify-own-collective-jobs*', 'scripts/lib/own-collective-jobs*', 'scripts/migrations/225-own-collective-jobs.sql', 'scripts/migrations/156-own-salary-seniority.sql', 'scripts/migrations/162-own-seniority-command-guard.sql', 'tests/own-collective-jobs*', 'tests/fixtures/own-collective*', 'package.json', 'package-lock.json', 'vercel.json', 'assets/own-payroll-program*', 'assets/own-payroll-run-model.js', 'assets/payroll-navigation.js', 'api/internal-own-contract-working-time.js', 'lib/internal-own-contract-working-time.js', 'lib/own-payroll-approved-input.js', 'lib/internal-own-payroll-run.js', 'lib/own-period-read-recovery.js', 'scripts/verify-own-contract-working-time.mjs', 'scripts/verify-collective-working-time*', 'scripts/prepare-own-contract-working-time-installation.mjs', 'scripts/build-friendly.mjs', '.vercelignore', 'scripts/lib/own-contract-working-time*', 'scripts/migrations/163-own-contract-working-time.sql', 'scripts/migrations/164-own-working-time-program-source.sql', 'tests/own-contract-working-time*', 'tests/fixtures/own-contract-working-time*', '.github/workflows/own-contract-working-time.yml']
  push:
    branches: ['master']
    paths: ['scripts/lib/ci-tested-build.mjs', 'tests/ci-tested-build.test.js', 'scripts/own-art-tested-build.mjs', 'tests/own-art-tested-build.test.js', '.github/workflows/own-art.yml', 'assets/release-status-model.js', '.nvmrc', 'assets/own-contract-working-time*', 'assets/own-salary-seniority*', 'assets/own-collective-jobs*', 'api/internal-own-collective-*', 'lib/own-collective-jobs*', 'scripts/verify-own-collective-jobs*', 'scripts/lib/own-collective-jobs*', 'scripts/migrations/225-own-collective-jobs.sql', 'scripts/migrations/156-own-salary-seniority.sql', 'scripts/migrations/162-own-seniority-command-guard.sql', 'tests/own-collective-jobs*', 'tests/fixtures/own-collective*', 'package.json', 'package-lock.json', 'vercel.json', 'assets/own-payroll-program*', 'assets/own-payroll-run-model.js', 'assets/payroll-navigation.js', 'api/internal-own-contract-working-time.js', 'lib/internal-own-contract-working-time.js', 'lib/own-payroll-approved-input.js', 'lib/internal-own-payroll-run.js', 'lib/own-period-read-recovery.js', 'scripts/verify-own-contract-working-time.mjs', 'scripts/verify-collective-working-time*', 'scripts/prepare-own-contract-working-time-installation.mjs', 'scripts/build-friendly.mjs', '.vercelignore', 'scripts/lib/own-contract-working-time*', 'scripts/migrations/163-own-contract-working-time.sql', 'scripts/migrations/164-own-working-time-program-source.sql', 'tests/own-contract-working-time*', 'tests/fixtures/own-contract-working-time*', '.github/workflows/own-contract-working-time.yml']
permissions:
  contents: read
concurrency:
  group: working-time-${{ github.ref }}
  cancel-in-progress: true
env:
  ART_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  tested_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      manifest_sha: ${{ steps.custody.outputs['manifest-sha'] }}
      artifact_id: ${{ steps.shared_upload.outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refuse ambient database and optional local test inputs
        run: node scripts/lib/ci-tested-build.mjs preflight own-contract-working-time
      - name: Complete original general tests and build once for this matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/ci-tested-build-own-contract-working-time.log"
      - name: Seal tested public bytes with exact source and current-run identity
        id: custody
        run: node scripts/lib/ci-tested-build.mjs create own-contract-working-time
      - name: Upload immutable current-run tested public bytes
        id: shared_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tested-public-own-contract-working-time-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-tested-public-own-contract-working-time/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5
      - name: Require the immutable uploaded artifact identifier
        shell: bash
        env:
          CI_BUILD_ARTIFACT_ID: ${{ steps.shared_upload.outputs['artifact-id'] }}
        run: |
          set -euo pipefail
          [[ "$CI_BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Preserve complete general build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tested-build-own-contract-working-time-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-tested-build-own-contract-working-time.log
          if-no-files-found: warn
          retention-days: 5
  verify:
    needs: tested_build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Fail closed when the full-suite producer did not succeed
        if: ${{ always() && (needs.tested_build.result != 'success' || cancelled()) }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require exact producer outputs before downloading
        shell: bash
        env:
          CI_BUILD_ARTIFACT_ID: ${{ needs.tested_build.outputs.artifact_id }}
          CI_BUILD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          [[ "$CI_BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CI_BUILD_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - name: Download only the immutable artifact emitted by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.tested_build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci-tested-public-own-contract-working-time
      - name: Verify exact source, runtime, run and every public byte before use
        env:
          CI_BUILD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: node scripts/lib/ci-tested-build.mjs verify own-contract-working-time
      - name: Prepare the existing disposable QA database
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - name: Verify durable collective jobs with PostgreSQL 17
        if: matrix.pg == 17
        # The existing disposable service; no municipal data, session or connection.
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: node scripts/verify-own-collective-jobs.mjs --psql "$(command -v psql)" --transport ci --output verification/collective-server-sql-pg${{ matrix.pg }}/result.json
      - run: npx --no-install playwright install-deps chromium
      - name: Use the project browser already admitted for release verification
        run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Verify complete collective declarations and recoverable individual decisions
        # Source frontend and fictional HTTP envelopes only; no municipal session or SQL.
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-collective-working-time-ci.mjs --output=verification/collective-working-time-pg${{ matrix.pg }}
      - name: Complete documented hours, immutable attempts, actual SQL and desktop/mobile browser
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-own-contract-working-time.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --browser=chromium --output=verification/native-working-time-pg${{ matrix.pg }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-working-time-pg${{ matrix.pg }}-${{ github.sha }}
          path: |
            verification/collective-working-time-pg${{ matrix.pg }}
            verification/collective-server-sql-pg${{ matrix.pg }}/result.json
            verification/native-working-time-pg${{ matrix.pg }}/result.json
            verification/native-working-time-pg${{ matrix.pg }}/partial-checks.json
            verification/native-working-time-pg${{ matrix.pg }}/failure.txt
            verification/native-working-time-pg${{ matrix.pg }}/working-time-proof.json
            verification/native-working-time-pg${{ matrix.pg }}/working-time-browser-proof.json
            verification/native-working-time-pg${{ matrix.pg }}/working-time-browser-failure.json
            verification/native-working-time-pg${{ matrix.pg }}/missing-source-error.json
            verification/native-working-time-pg${{ matrix.pg }}/*.png
            verification/release-chromium-157.0.8098.0/installation.json
          retention-days: 5
