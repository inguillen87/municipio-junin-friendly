name: Own payroll accounting associations
on:
  pull_request:
    paths: ['scripts/lib/ci-tested-build.mjs', 'tests/ci-tested-build.test.js', 'scripts/own-art-tested-build.mjs', 'tests/own-art-tested-build.test.js', '.github/workflows/own-art.yml', 'assets/release-status-model.js', 'package.json', 'package-lock.json', '.nvmrc', 'assets/own-payroll-accounting*', 'assets/payroll-navigation.js', 'api/internal-own-payroll-accounting.js', 'lib/internal-own-payroll-accounting.js', 'scripts/migrations/147-*', 'scripts/migrations/150-*', 'scripts/*own-payroll-accounting*', 'scripts/*own-accounting*', 'scripts/lib/own-accounting*.mjs', 'tests/own-payroll-accounting*', 'tests/fixtures/own-payroll-accounting*', 'scripts/build-friendly.mjs', '.github/workflows/own-payroll-accounting.yml']
  push:
    branches: ['master']
    paths: ['scripts/lib/ci-tested-build.mjs', 'tests/ci-tested-build.test.js', 'scripts/own-art-tested-build.mjs', 'tests/own-art-tested-build.test.js', '.github/workflows/own-art.yml', 'assets/release-status-model.js', 'package.json', 'package-lock.json', '.nvmrc', 'assets/own-payroll-accounting*', 'assets/payroll-navigation.js', 'api/internal-own-payroll-accounting.js', 'lib/internal-own-payroll-accounting.js', 'scripts/migrations/147-*', 'scripts/migrations/150-*', 'scripts/*own-payroll-accounting*', 'scripts/*own-accounting*', 'scripts/lib/own-accounting*.mjs', 'tests/own-payroll-accounting*', 'tests/fixtures/own-payroll-accounting*', 'scripts/build-friendly.mjs', '.github/workflows/own-payroll-accounting.yml']
permissions:
  contents: read
concurrency:
  group: own-payroll-accounting-${{ github.ref }}
  cancel-in-progress: true
env:
  ART_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  tested_build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      manifest_sha: ${{ steps.custody.outputs['manifest-sha'] }}
      artifact_id: ${{ steps.shared_upload.outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refuse ambient database and optional local test inputs
        run: node scripts/lib/ci-tested-build.mjs preflight own-payroll-accounting
      - name: Complete original general tests and build once for this matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/ci-tested-build-own-payroll-accounting.log"
      - name: Seal tested public bytes with exact source and current-run identity
        id: custody
        run: node scripts/lib/ci-tested-build.mjs create own-payroll-accounting
      - name: Upload immutable current-run tested public bytes
        id: shared_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tested-public-own-payroll-accounting-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-tested-public-own-payroll-accounting/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5
      - name: Require the immutable uploaded artifact identifier
        shell: bash
        env:
          CI_BUILD_ARTIFACT_ID: ${{ steps.shared_upload.outputs['artifact-id'] }}
        run: |
          set -euo pipefail
          [[ "$CI_BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Preserve complete general build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tested-build-own-payroll-accounting-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-tested-build-own-payroll-accounting.log
          if-no-files-found: warn
          retention-days: 5
  accounting:
    needs: tested_build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Fail closed when the full-suite producer did not succeed
        if: ${{ always() && (needs.tested_build.result != 'success' || cancelled()) }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require exact producer outputs before downloading
        shell: bash
        env:
          CI_BUILD_ARTIFACT_ID: ${{ needs.tested_build.outputs.artifact_id }}
          CI_BUILD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          [[ "$CI_BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CI_BUILD_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - name: Download only the immutable artifact emitted by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.tested_build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci-tested-public-own-payroll-accounting
      - name: Verify exact source, runtime, run and every public byte before use
        env:
          CI_BUILD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: node scripts/lib/ci-tested-build.mjs verify own-payroll-accounting
      - run: npx playwright install --with-deps chromium
      - name: Prepare isolated databases and restricted runtime
        env:
          PGPASSWORD: synthetic_ci_only
        run: |
          psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
          createdb -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres own_payroll_accounting_qa
          psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_accounting_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto;'
      - name: Unchanged prerequisites, installation conservation, complete configuration and independent review
        env:
          PGPASSWORD: synthetic_ci_only
        run: |
          node scripts/verify-own-payroll-accounting-sql.mjs --ci --expected-major=${{ matrix.pg }} --write-sql=verification/accounting-ci-pg${{ matrix.pg }}.sql
          psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_accounting_qa -v ON_ERROR_STOP=1 -f verification/accounting-ci-pg${{ matrix.pg }}.sql
      - name: Built UI, actual HTTP/SQL, history, lost response, full pages and mobile access
        env:
          PGPASSWORD: synthetic_ci_only
        run: node scripts/verify-own-payroll-accounting-ui.mjs --ci --built --major=${{ matrix.pg }} --psql=psql --browser=chromium --output=verification/accounting-ci-ui-pg${{ matrix.pg }}.json
      - name: Exact bank validator upgrade, old pending request and independent durability
        env:
          PGPASSWORD: synthetic_ci_only
        run: node scripts/verify-own-accounting-bank-installation.mjs --major=${{ matrix.pg }} --psql=psql --output=verification/accounting-ci-bank-installation-pg${{ matrix.pg }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-payroll-accounting-pg${{ matrix.pg }}-${{ github.run_id }}
          path: verification/accounting-ci*
          retention-days: 5
