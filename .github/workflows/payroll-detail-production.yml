name: Payroll detail production verification
on:
  push:
    branches: ['master']
permissions:
  contents: read
concurrency:
  group: payroll-detail-production
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-payroll-detail-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payroll-detail-production-verification
          path: verification/payroll-detail-production.json
          retention-days: 5
