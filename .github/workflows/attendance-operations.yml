name: Attendance operations validation
on:
  push:
    branches: ['master', 'feat/attendance-pm10-operations-20260910']
  pull_request:
    paths: ['api/*attendance*', 'lib/*attendance*', 'services/attendance-edge/**', 'assets/attendance-*', 'tests/*attendance*', 'scripts/*clock*', 'scripts/*attendance*', 'scripts/migrations/*clock*', 'scripts/migrations/*attendance*', 'relojes-marcaciones.html', '.github/workflows/attendance-operations.yml']
permissions:
  contents: read
concurrency:
  group: attendance-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate deterministic tracked integration
        run: node scripts/integrate-clock-operations.mjs
      - run: npm ci
      - name: Repository tests
        run: npm test
      - name: Clock operations unit and security tests
        run: node --test tests/attendance-clock-operations.test.js tests/internal-attendance-api.test.js
      - name: Build
        run: node scripts/build-friendly.mjs
      - name: Commit validated integration only on attendance feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/attendance-pm10-operations-20260910'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/internal-attendance.js relojes-marcaciones.html scripts/build-friendly.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'feat(attendance): wire validated clock workspace and authenticated read route'
            git push origin HEAD:feat/attendance-pm10-operations-20260910
          fi
      - name: Require committed production sources
        if: github.ref == 'refs/heads/master'
        run: git diff --exit-code -- api/internal-attendance.js relojes-marcaciones.html scripts/build-friendly.mjs
      - name: Prepare tracked source snapshot (no runtime data or credentials)
        run: git archive --format=tar.gz -o attendance-source-snapshot.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-source-snapshot
          path: attendance-source-snapshot.tar.gz
          retention-days: 1
  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public deployment and unauthenticated data boundary
        run: node scripts/verify-clock-production.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: clock-production-smoke
          path: verification/clock-production-smoke.json
          retention-days: 7
