name: Own F931 preparation
on:
  pull_request:
    paths: ['assets/own-f931-*', 'assets/payroll-navigation.js', 'scripts/build-friendly.mjs', 'scripts/verify-own-f931-preparation-browser.mjs', 'tests/own-f931-preparation.test.js', '.github/workflows/own-f931-preparation.yml']
  push:
    branches: ['master']
    paths: ['assets/own-f931-*', 'assets/payroll-navigation.js', 'scripts/build-friendly.mjs', 'scripts/verify-own-f931-preparation-browser.mjs', 'tests/own-f931-preparation.test.js', '.github/workflows/own-f931-preparation.yml']
permissions:
  contents: read
concurrency:
  group: own-f931-preparation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Own complete fiscal preparation with synthetic read fixtures
        run: node scripts/verify-own-f931-preparation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-f931-preparation-${{ github.run_id }}
          path: verification/own-f931-browser-20261011
          retention-days: 5
