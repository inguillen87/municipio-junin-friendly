name: Own F931 preparation
on:
  pull_request:
    paths: ['assets/own-f931-*', 'assets/payroll-navigation.js', 'scripts/build-friendly.mjs', 'scripts/verify-own-f931-preparation-browser.mjs', 'tests/own-f931-preparation.test.js', 'tests/own-f931-fiscal-coverage.test.js', 'tests/fixtures/own-f931-fiscal-coverage-synthetic.js', 'scripts/verify-own-f931-fiscal-coverage-browser.mjs', 'scripts/install-project-chromium.mjs', 'scripts/lib/project-chromium.mjs', 'scripts/lib/patched-chromium-diagnostic-manifest.mjs', 'scripts/verify-source-preview-fragmented-transport.mjs', 'docs/QA_CHROMIUM_VERIFIED_20261011.md', 'tests/project-chromium-workflow.test.js', '.github/workflows/own-f931-preparation.yml']
  push:
    branches: ['master']
    paths: ['assets/own-f931-*', 'assets/payroll-navigation.js', 'scripts/build-friendly.mjs', 'scripts/verify-own-f931-preparation-browser.mjs', 'tests/own-f931-preparation.test.js', 'tests/own-f931-fiscal-coverage.test.js', 'tests/fixtures/own-f931-fiscal-coverage-synthetic.js', 'scripts/verify-own-f931-fiscal-coverage-browser.mjs', 'scripts/install-project-chromium.mjs', 'scripts/lib/project-chromium.mjs', 'scripts/lib/patched-chromium-diagnostic-manifest.mjs', 'scripts/verify-source-preview-fragmented-transport.mjs', 'docs/QA_CHROMIUM_VERIFIED_20261011.md', 'tests/project-chromium-workflow.test.js', '.github/workflows/own-f931-preparation.yml']
permissions:
  contents: read
concurrency:
  group: own-f931-preparation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:vercel
      - run: npx playwright install --with-deps chromium
      - run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Complete and rejected native delivery regression
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-source-preview-fragmented-transport.mjs
      - name: Own complete fiscal preparation with synthetic read fixtures
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-own-f931-preparation-browser.mjs
      - name: Own closed-legajo fiscal coverage with synthetic read fixtures
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-own-f931-fiscal-coverage-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-f931-preparation-${{ github.run_id }}
          path: |
            verification/own-f931-browser-20261011
            verification/own-f931-coverage-browser-20261011
            verification/payroll-formula-transport/fragmented-regression
            verification/release-chromium-157.0.8098.0/installation.json
          retention-days: 5
