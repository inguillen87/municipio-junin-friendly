name: Own payroll receipts
on:
  workflow_dispatch:
  push:
    branches: ['master', 'codex/candidate-admission-20261028', 'codex/own-payroll-receipts-20261005']
    paths: ['assets/own-payroll-*', 'assets/payroll-navigation.js', 'centro-acciones.html', 'nomina-control.html', 'api/internal-own-payroll-receipts.js', 'lib/internal-own-payroll-receipts.js', 'scripts/migrations/126-*', 'scripts/*own-payroll*receipt*.mjs', 'scripts/lib/own-payroll-*', 'tests/own-payroll-receipt*.test.js', 'tests/fixtures/own-payroll-*', 'scripts/build-friendly.mjs', '.github/workflows/own-payroll-receipts.yml', 'vercel.json', '.vercelignore', 'package.json', 'package-lock.json', '.nvmrc', 'scripts/*release*.mjs', 'scripts/lib/release-candidate-admission.mjs', 'tests/release-*.test.js', 'tests/fixtures/release-candidate-*.js', '.github/workflows/own-payroll-*.yml']
  pull_request:
    paths: ['assets/own-payroll-*', 'assets/payroll-navigation.js', 'centro-acciones.html', 'nomina-control.html', 'api/internal-own-payroll-receipts.js', 'lib/internal-own-payroll-receipts.js', 'scripts/migrations/126-*', 'scripts/*own-payroll*receipt*.mjs', 'scripts/lib/own-payroll-*', 'tests/own-payroll-receipt*.test.js', 'tests/fixtures/own-payroll-*', 'scripts/build-friendly.mjs', '.github/workflows/own-payroll-receipts.yml', 'vercel.json', '.vercelignore', 'package.json', 'package-lock.json', '.nvmrc', 'scripts/*release*.mjs', 'scripts/lib/release-candidate-admission.mjs', 'tests/release-*.test.js', 'tests/fixtures/release-candidate-*.js', '.github/workflows/own-payroll-*.yml']
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        major: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.major }}
        env:
          POSTGRES_DB: own_payroll_run_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: own-receipt-synthetic-qa
        ports:
          - 554${{ matrix.major }}:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: own-receipt-synthetic-qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Record release candidate source before verification
        run: node scripts/write-release-candidate-proof.mjs --workflow=receipts --major=${{ matrix.major }} --phase=before
      - run: mkdir -p verification
      - name: Record receipt source before verification
        run: |
          git rev-parse HEAD > verification/own-receipts-source-before-commit.txt
          git diff --exit-code HEAD -- assets/own-payroll-receipt-pdf.js assets/own-payroll-receipt-model.js tests/own-payroll-receipts.test.js tests/own-payroll-receipt-pdf-layout.test.js tests/own-payroll-receipt-pdf-totals-pagination.test.js tests/fixtures/own-payroll-receipt-synthetic.js .github/workflows/own-payroll-receipts.yml
          sha256sum -- assets/own-payroll-receipt-pdf.js assets/own-payroll-receipt-model.js tests/own-payroll-receipts.test.js tests/own-payroll-receipt-pdf-layout.test.js tests/own-payroll-receipt-pdf-totals-pagination.test.js tests/fixtures/own-payroll-receipt-synthetic.js .github/workflows/own-payroll-receipts.yml > verification/own-receipts-source-before.sha256
          cp -- .github/workflows/own-payroll-receipts.yml verification/own-receipts-workflow.yml
      - run: psql -h 127.0.0.1 -p 554${{ matrix.major }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOSUPERUSER NOBYPASSRLS;'
      - run: node --test tests/own-payroll-receipt*.test.js tests/own-payroll-close*.test.js
      - run: node scripts/verify-own-payroll-receipts.mjs --major=${{ matrix.major }} --output=verification/own-receipts-sql.json
      - run: node scripts/verify-own-payroll-receipt-installation.mjs --major=${{ matrix.major }} --source-commit=${{ github.sha }} --output=verification/own-receipts-installation.json
      - name: Full web suite and package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification
          npm run build 2>&1 | tee verification/release-full-suite.log
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-own-payroll-receipt-types-browser.mjs --output=verification/own-receipt-types-operator-browser
      - run: node scripts/verify-own-payroll-receipt-description-browser.mjs --output=verification/own-receipt-descriptions-operator-browser
      - run: node scripts/verify-own-payroll-receipt-ui.mjs --major=${{ matrix.major }} --browser=chromium --output=verification/own-receipts-ui.json
      - name: Verify receipt source after verification
        if: always()
        run: |
          git rev-parse HEAD > verification/own-receipts-source-after-commit.txt
          sha256sum -- assets/own-payroll-receipt-pdf.js assets/own-payroll-receipt-model.js tests/own-payroll-receipts.test.js tests/own-payroll-receipt-pdf-layout.test.js tests/own-payroll-receipt-pdf-totals-pagination.test.js tests/fixtures/own-payroll-receipt-synthetic.js .github/workflows/own-payroll-receipts.yml > verification/own-receipts-source-after.sha256
          cmp verification/own-receipts-source-before-commit.txt verification/own-receipts-source-after-commit.txt
          cmp verification/own-receipts-source-before.sha256 verification/own-receipts-source-after.sha256
          git diff --exit-code HEAD -- assets/own-payroll-receipt-pdf.js assets/own-payroll-receipt-model.js tests/own-payroll-receipts.test.js tests/own-payroll-receipt-pdf-layout.test.js tests/own-payroll-receipt-pdf-totals-pagination.test.js tests/fixtures/own-payroll-receipt-synthetic.js .github/workflows/own-payroll-receipts.yml
          cmp .github/workflows/own-payroll-receipts.yml verification/own-receipts-workflow.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipts-operator-ux-pg${{ matrix.major }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/own-receipts-source-before-commit.txt
            verification/own-receipts-source-after-commit.txt
            verification/own-receipts-source-before.sha256
            verification/own-receipts-source-after.sha256
            verification/own-receipts-sql.json
            verification/own-receipts-installation.json
            verification/own-receipts-ui.json
            assets/own-payroll-receipt-pdf.js
            assets/own-payroll-receipt-model.js
            tests/own-payroll-receipts.test.js
            tests/own-payroll-receipt-pdf-layout.test.js
            tests/own-payroll-receipt-pdf-totals-pagination.test.js
            tests/fixtures/own-payroll-receipt-synthetic.js
            verification/own-receipts-workflow.yml
            verification/own-receipt-descriptions-operator-browser/
            verification/own-receipt-types-operator-browser/result.json
            verification/own-receipt-types-operator-browser/partial.json
            verification/own-receipt-types-operator-browser/failure.txt
            verification/own-receipt-types-operator-browser/operator-choice-1366.png
            verification/own-receipt-types-operator-browser/operator-choice-390.png
            verification/own-receipt-types-operator-browser/operator-choice-320.png
            verification/own-receipt-types-operator-browser/receipt-types-1366.png
            verification/own-receipt-types-operator-browser/receipt-types-390.png
            verification/own-receipt-types-operator-browser/receipt-types-320.png
            verification/own-receipt-types-operator-browser/operator-group-1366.pdf
            verification/own-receipt-types-operator-browser/operator-group-390.pdf
            verification/own-receipt-types-operator-browser/operator-group-320.pdf
            verification/own-receipt-types-operator-browser/operator-individual-1366.pdf
            verification/own-receipt-types-operator-browser/operator-individual-390.pdf
            verification/own-receipt-types-operator-browser/operator-individual-320.pdf
          retention-days: 5
      - name: Record release candidate evidence
        run: node scripts/write-release-candidate-proof.mjs --workflow=receipts --major=${{ matrix.major }} --phase=after
      - name: Upload release candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-receipts-pg${{ matrix.major }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/release-candidate/receipts-pg${{ matrix.major }}/
          if-no-files-found: error
          retention-days: 5
