name: Own payroll receipts
on:
  push:
    branches: ['master', 'codex/own-payroll-receipts-20261005']
    paths: ['assets/own-payroll-*', 'assets/payroll-navigation.js', 'centro-acciones.html', 'api/internal-own-payroll-receipts.js', 'lib/internal-own-payroll-receipts.js', 'scripts/migrations/126-*', 'scripts/*own-payroll*receipt*.mjs', 'scripts/lib/own-payroll-*', 'tests/own-payroll-receipt*.test.js', 'tests/fixtures/own-payroll-*', 'scripts/build-friendly.mjs', '.github/workflows/own-payroll-receipts.yml']
  pull_request:
    paths: ['assets/own-payroll-*', 'assets/payroll-navigation.js', 'centro-acciones.html', 'api/internal-own-payroll-receipts.js', 'lib/internal-own-payroll-receipts.js', 'scripts/migrations/126-*', 'scripts/*own-payroll*receipt*.mjs', 'scripts/lib/own-payroll-*', 'tests/own-payroll-receipt*.test.js', 'tests/fixtures/own-payroll-*', 'scripts/build-friendly.mjs', '.github/workflows/own-payroll-receipts.yml']
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        major: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.major }}
        env:
          POSTGRES_DB: own_payroll_run_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: own-receipt-synthetic-qa
        ports:
          - 554${{ matrix.major }}:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: own-receipt-synthetic-qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p verification
      - name: Record checkout for the isolated receipt gates
        run: git rev-parse HEAD > verification/own-receipt-source-head.txt
      - run: psql -h 127.0.0.1 -p 554${{ matrix.major }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOSUPERUSER NOBYPASSRLS;'
      - run: node --test tests/own-payroll-receipt*.test.js tests/own-payroll-close*.test.js
      - run: node scripts/verify-own-payroll-receipts.mjs --major=${{ matrix.major }} --output=verification/own-receipts-sql.json
      - run: node scripts/verify-own-payroll-receipt-installation.mjs --major=${{ matrix.major }} --source-commit=${{ github.sha }} --output=verification/own-receipts-installation.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify the project Chromium runtime for the combined receipt gate
        run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Receipt types and combined ranges browser
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-own-payroll-receipt-types-browser.mjs --output=verification/own-receipt-types-browser
      - run: node scripts/verify-own-payroll-receipt-ui.mjs --major=${{ matrix.major }} --browser=chromium --output=verification/own-receipts-ui.json
      - name: Verify combined receipt ranges through existing SQL142 regression
        run: node scripts/verify-adopted-own-payroll-receipts.mjs --major=${{ matrix.major }} --output=verification/adopted-own-receipts-combined.json
      - name: Preserve receipt type and combined range browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: own-receipt-types-browser-pg${{ matrix.major }}-${{ github.sha }}
          path: |
            verification/own-receipt-types-browser/
            verification/release-chromium-157.0.8098.0/installation.json
            verification/own-receipt-source-head.txt
          if-no-files-found: error
      - name: Preserve native SQL142 combined range evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: own-receipt-combined-native-pg${{ matrix.major }}-${{ github.sha }}
          path: |
            verification/adopted-own-receipts-combined*
            verification/own-receipt-source-head.txt
          if-no-files-found: error
