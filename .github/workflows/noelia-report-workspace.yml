name: Noelia report workspace
on:
  push:
    branches: ['master']
    paths:
      - 'src/islands/**'
      - 'api/internal-payroll-parameters.js'
      - 'lib/internal-payroll-parameters.js'
      - 'lib/payroll-parameter-contract.js'
      - 'assets/payroll-parameters-loader.js'
      - 'assets/payroll-navigation.js'
      - 'assets/liquidaciones-menu.js'
      - 'scripts/build-payroll-parameters.mjs'
      - 'scripts/verify-payroll-parameters-*.mjs'
      - 'tests/payroll-parameters.test.js'
      - 'licencias-control.html'
      - 'assets/app-routes.js'
      - 'scripts/build-friendly.mjs'
      - 'scripts/build-react-islands.mjs'
      - 'tests/leave-workspace.test.js'
      - 'tests/app-routes.test.js'
      - 'scripts/verify-leave-workspace-*.mjs'
      - 'tests/report-catalog*.test.js'
      - 'tests/noelia-report-network-policy.test.js'
      - 'scripts/noelia-report-network-policy.mjs'
      - 'scripts/verify-noelia-report-*.mjs'
      - 'scripts/verify-report-catalog-browser.mjs'
      - 'scripts/verify-report-catalog-views-browser.mjs'
      - 'scripts/verify-report-centre-browser.mjs'
      - '.github/workflows/noelia-report-workspace.yml'
  pull_request:
    branches: ['master']
    paths:
      - 'src/islands/**'
      - 'api/internal-payroll-parameters.js'
      - 'lib/internal-payroll-parameters.js'
      - 'lib/payroll-parameter-contract.js'
      - 'assets/payroll-parameters-loader.js'
      - 'assets/payroll-navigation.js'
      - 'assets/liquidaciones-menu.js'
      - 'scripts/build-payroll-parameters.mjs'
      - 'scripts/verify-payroll-parameters-*.mjs'
      - 'tests/payroll-parameters.test.js'
      - 'licencias-control.html'
      - 'assets/app-routes.js'
      - 'scripts/build-friendly.mjs'
      - 'scripts/build-react-islands.mjs'
      - 'tests/leave-workspace.test.js'
      - 'tests/app-routes.test.js'
      - 'scripts/verify-leave-workspace-*.mjs'
      - 'tests/report-catalog*.test.js'
      - 'tests/noelia-report-network-policy.test.js'
      - 'scripts/noelia-report-network-policy.mjs'
      - 'scripts/verify-noelia-report-*.mjs'
      - 'scripts/verify-report-catalog-browser.mjs'
      - 'scripts/verify-report-catalog-views-browser.mjs'
      - 'scripts/verify-report-centre-browser.mjs'
      - '.github/workflows/noelia-report-workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noelia-report-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full tests and reproducible build
        run: |
          node --check scripts/verify-noelia-report-live-browser.mjs
          node --check scripts/verify-report-catalog-views-browser.mjs
          npm run build
      - run: npx playwright install --with-deps chromium
      - name: Existing catalog, new workspace and report regression
        run: |
          node scripts/verify-report-catalog-browser.mjs
          node scripts/verify-noelia-report-workspace-browser.mjs
          node scripts/verify-report-centre-browser.mjs
          node scripts/verify-noelia-report-live-browser.mjs --local
          node scripts/verify-leave-workspace-browser.mjs
          node scripts/verify-payroll-parameters-browser.mjs
      - name: Synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: noelia-report-workspace-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/report-catalog-react-*.json
            verification/report-catalog-react-*.png
            verification/noelia-report-workspace-*.json
            verification/noelia-report-workspace-*.png
            verification/noelia-report-network-local-*.json
            verification/noelia-report-network-local-*.png
            verification/report-centre-browser.json
            verification/report-centre-browser-error.txt
            verification/leave-workspace-local*
            verification/parameters-local/**
          retention-days: 5
      # Reuse this checkout, node_modules, build and Chromium. No second runner.
      - name: Verify published executable and license bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/verify-noelia-report-production.mjs
      - name: Verify live public interface without municipal session
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          node scripts/verify-noelia-report-live-browser.mjs
          node scripts/verify-leave-workspace-production.mjs
          node scripts/verify-leave-workspace-browser.mjs --published
          node scripts/verify-payroll-parameters-production.mjs
          node scripts/verify-payroll-parameters-browser.mjs --published
      - name: Publication evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: noelia-report-workspace-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/noelia-report-production.json
            verification/noelia-report-live-*.json
            verification/noelia-report-live-*.png
            verification/leave-workspace-production.json
            verification/leave-workspace-live*
            verification/payroll-parameters-production.json
            verification/parameters-published/**
          retention-days: 14
