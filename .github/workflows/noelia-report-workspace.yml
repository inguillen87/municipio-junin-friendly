name: Noelia report workspace
on:
  push:
    branches: ['master', 'chatgpt/noelia-report-workspace-20260915']
    paths:
      - 'src/islands/**'
      - 'tests/report-catalog*.test.js'
      - 'scripts/verify-noelia-report-*.mjs'
      - '.github/workflows/noelia-report-workspace.yml'
  pull_request:
    paths:
      - 'src/islands/**'
      - 'tests/report-catalog*.test.js'
      - 'scripts/verify-noelia-report-*.mjs'
      - '.github/workflows/noelia-report-workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noelia-report-workspace-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full tests and reproducible build
        run: |
          node --check scripts/verify-noelia-report-live-browser.mjs
          npm run build
      - run: npx playwright install --with-deps chromium
      - name: Existing catalog, new workspace and report regression
        run: |
          node scripts/verify-report-catalog-browser.mjs
          node scripts/verify-noelia-report-workspace-browser.mjs
          node scripts/verify-report-centre-browser.mjs
      - name: Synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noelia-report-workspace-browser-${{ github.run_id }}
          path: |
            verification/report-catalog-react-*.json
            verification/report-catalog-react-*.png
            verification/noelia-report-workspace-*.json
            verification/noelia-report-workspace-*.png
          retention-days: 5
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/build-friendly.mjs
      - name: Verify published executable and license bytes
        run: node scripts/verify-noelia-report-production.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify live public interface without municipal session
        run: node scripts/verify-noelia-report-live-browser.mjs
      - name: Publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noelia-report-workspace-production-${{ github.run_id }}
          path: |
            verification/noelia-report-production.json
            verification/noelia-report-live-*.json
            verification/noelia-report-live-*.png
          retention-days: 14
