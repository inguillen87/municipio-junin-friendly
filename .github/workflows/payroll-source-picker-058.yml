name: Payroll source selection 058
on:
  push:
    branches: ['feat/haberes-selector-fuentes-058', 'master']
    paths:
      - '.github/workflows/payroll-source-picker-058.yml'
      - 'scripts/patches/source-picker-058*'
      - 'assets/payroll-source-*'
      - 'reportes-rrhh.html'
      - 'nomina-control.html'
      - 'scripts/build-friendly.mjs'
      - 'sw.js'
      - 'scripts/verify-payroll-source-picker*'
      - 'scripts/payroll-source-picker-synthetic.mjs'
      - 'tests/payroll-source-picker-058.test.js'
permissions:
  contents: read
concurrency:
  group: source-picker-058-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p verification
      - name: Apply exactly reviewed source
        shell: bash
        run: |
          set -euo pipefail
          if test -f scripts/patches/source-picker-058.b64.1; then
            cat scripts/patches/source-picker-058.b64.{1,2} | base64 --decode > /tmp/source-picker-058.gz
            echo '698f0853ef376409a9a3d4c66c3c5a39047a46dd2445dd20a81e52d204d395cd  /tmp/source-picker-058.gz' | sha256sum --check -
            gzip -dc /tmp/source-picker-058.gz > /tmp/source-picker-058.patch
            git apply --check /tmp/source-picker-058.patch
            git apply /tmp/source-picker-058.patch
          fi
          if test -f scripts/patches/source-picker-058-fix.patch; then
            git apply --check scripts/patches/source-picker-058-fix.patch
            git apply scripts/patches/source-picker-058-fix.patch
          fi
          git diff --check
      - run: npm ci
      - name: Full unit tests and static build
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee verification/all-tests.log
          node scripts/build-friendly.mjs 2>&1 | tee verification/build.log
      - run: npx playwright install --with-deps chromium
      - name: Source catalogue and guarded export browser checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-payroll-source-picker-058.mjs 2>&1 | tee verification/source-picker-browser.log
      - name: Regressions including concurrent novelty release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-report-centre-browser.mjs 2>&1 | tee verification/report-centre.log
          node scripts/verify-export-roster-browser.mjs 2>&1 | tee verification/roster.log
          node scripts/verify-payroll-comparison-056.mjs 2>&1 | tee verification/comparison.log
          node scripts/verify-payroll-summary-055.mjs 2>&1 | tee verification/summary.log
          node scripts/verify-report-summary-shell.mjs 2>&1 | tee verification/summary-shell.log
          node scripts/verify-document-library-legajo.mjs 2>&1 | tee verification/library.log
          node scripts/verify-novelty-list-057.mjs 2>&1 | tee verification/novelty-list.log
          node scripts/verify-novelty-review-056.mjs 2>&1 | tee verification/novelty-review.log
      - name: Commit validated source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/payroll-source-picker.js assets/payroll-source-picker.css assets/payroll-source-reports.js reportes-rrhh.html nomina-control.html scripts/build-friendly.mjs sw.js scripts/payroll-source-picker-synthetic.mjs scripts/verify-payroll-source-picker-058.mjs scripts/verify-payroll-source-picker-production-058.mjs tests/payroll-source-picker-058.test.js docs/SPRINT_058_SELECTOR_FUENTES_HABERES.md
          if test -f scripts/patches/source-picker-058.b64.1; then git rm scripts/patches/source-picker-058.b64.{1,2}; fi
          if test -f scripts/patches/source-picker-058-fix.patch; then git rm scripts/patches/source-picker-058-fix.patch; fi
          if ! git diff --cached --quiet; then
            git commit -m 'feat(058): disambiguate payroll sources and protect filtered exports'
            git push origin HEAD:feat/haberes-selector-fuentes-058
          fi
          git rev-parse HEAD > verification/validated-commit.txt
      - name: Archive exact source and verification
        if: always()
        run: |
          git diff HEAD > verification/pending-changes.patch
          git archive --format=tar.gz -o verification/source-picker-058-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-picker-058-acceptance
          path: verification/
          retention-days: 5
  production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify canonical source bytes and anonymous denial
        run: node scripts/verify-payroll-source-picker-production-058.mjs
      - name: Check published UI with synthetic APIs only
        env:
          SOURCE_PICKER_LIVE_ASSETS: '1'
        run: node scripts/verify-payroll-source-picker-058.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-picker-058-production-verification
          path: verification/
          retention-days: 5
