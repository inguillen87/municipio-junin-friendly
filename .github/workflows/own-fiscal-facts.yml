name: Own documented fiscal facts
on:
  pull_request:
    paths: ['scripts/lib/ci-tested-build.mjs', 'tests/ci-tested-build.test.js', 'scripts/own-art-tested-build.mjs', 'tests/own-art-tested-build.test.js', '.github/workflows/own-art.yml', 'assets/release-status-model.js', 'package.json', 'package-lock.json', '.nvmrc', 'scripts/lib/qa-run-capture-lock.mjs', 'tests/qa-run-capture-lock.test.js', 'scripts/verify-salary-auxiliary-namespace.mjs', 'scripts/verify-own-period-participation.mjs', 'lib/own-period-read-recovery.js', 'tests/own-period-read-recovery.test.js', 'scripts/lib/own-period-read-contention-qa.mjs', 'api/internal-own-fiscal-facts.js', 'assets/own-fiscal-facts*', 'assets/own-f931-*', 'assets/payroll-navigation.js', 'lib/internal-own-fiscal-facts.js', 'scripts/build-friendly.mjs', 'scripts/verify-own-fiscal-facts.mjs', 'scripts/lib/own-fiscal-facts*', 'scripts/migrations/160-own-fiscal-facts.sql', 'tests/own-fiscal-facts*', 'tests/fixtures/own-fiscal-facts*', 'scripts/install-project-chromium.mjs', 'scripts/lib/project-chromium.mjs', 'scripts/lib/patched-chromium-diagnostic-manifest.mjs', 'scripts/verify-source-preview-fragmented-transport.mjs', 'docs/QA_CHROMIUM_VERIFIED_20261011.md', 'tests/project-chromium-workflow.test.js', 'scripts/lib/qa-lock-observation.mjs', 'tests/qa-lock-observation.test.js', 'scripts/verify-own-salary-seniority.mjs', '.github/workflows/own-fiscal-facts.yml']
  push:
    branches: ['master']
    paths: ['scripts/lib/ci-tested-build.mjs', 'tests/ci-tested-build.test.js', 'scripts/own-art-tested-build.mjs', 'tests/own-art-tested-build.test.js', '.github/workflows/own-art.yml', 'assets/release-status-model.js', 'package.json', 'package-lock.json', '.nvmrc', 'scripts/lib/qa-run-capture-lock.mjs', 'tests/qa-run-capture-lock.test.js', 'scripts/verify-salary-auxiliary-namespace.mjs', 'scripts/verify-own-period-participation.mjs', 'lib/own-period-read-recovery.js', 'tests/own-period-read-recovery.test.js', 'scripts/lib/own-period-read-contention-qa.mjs', 'api/internal-own-fiscal-facts.js', 'assets/own-fiscal-facts*', 'assets/own-f931-*', 'assets/payroll-navigation.js', 'lib/internal-own-fiscal-facts.js', 'scripts/build-friendly.mjs', 'scripts/verify-own-fiscal-facts.mjs', 'scripts/lib/own-fiscal-facts*', 'scripts/migrations/160-own-fiscal-facts.sql', 'tests/own-fiscal-facts*', 'tests/fixtures/own-fiscal-facts*', 'scripts/install-project-chromium.mjs', 'scripts/lib/project-chromium.mjs', 'scripts/lib/patched-chromium-diagnostic-manifest.mjs', 'scripts/verify-source-preview-fragmented-transport.mjs', 'docs/QA_CHROMIUM_VERIFIED_20261011.md', 'tests/project-chromium-workflow.test.js', 'scripts/lib/qa-lock-observation.mjs', 'tests/qa-lock-observation.test.js', 'scripts/verify-own-salary-seniority.mjs', '.github/workflows/own-fiscal-facts.yml']
permissions:
  contents: read
concurrency:
  group: own-fiscal-facts-${{ github.ref }}
  cancel-in-progress: true
env:
  ART_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  tested_build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      manifest_sha: ${{ steps.custody.outputs['manifest-sha'] }}
      artifact_id: ${{ steps.shared_upload.outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refuse ambient database and optional local test inputs
        run: node scripts/lib/ci-tested-build.mjs preflight own-fiscal-facts
      - name: Complete original general tests and build once for this matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/ci-tested-build-own-fiscal-facts.log"
      - name: Seal tested public bytes with exact source and current-run identity
        id: custody
        run: node scripts/lib/ci-tested-build.mjs create own-fiscal-facts
      - name: Upload immutable current-run tested public bytes
        id: shared_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tested-public-own-fiscal-facts-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-tested-public-own-fiscal-facts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5
      - name: Require the immutable uploaded artifact identifier
        shell: bash
        env:
          CI_BUILD_ARTIFACT_ID: ${{ steps.shared_upload.outputs['artifact-id'] }}
        run: |
          set -euo pipefail
          [[ "$CI_BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Preserve complete general build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tested-build-own-fiscal-facts-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-tested-build-own-fiscal-facts.log
          if-no-files-found: warn
          retention-days: 5
  verify:
    needs: tested_build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Fail closed when the full-suite producer did not succeed
        if: ${{ always() && (needs.tested_build.result != 'success' || cancelled()) }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require exact producer outputs before downloading
        shell: bash
        env:
          CI_BUILD_ARTIFACT_ID: ${{ needs.tested_build.outputs.artifact_id }}
          CI_BUILD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          [[ "$CI_BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CI_BUILD_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - name: Download only the immutable artifact emitted by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.tested_build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci-tested-public-own-fiscal-facts
      - name: Verify exact source, runtime, run and every public byte before use
        env:
          CI_BUILD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: node scripts/lib/ci-tested-build.mjs verify own-fiscal-facts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Complete and rejected native delivery regression
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-source-preview-fragmented-transport.mjs
      - name: Prepare disposable PostgreSQL under original runtime restrictions
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - name: Observe maintenance in the disposable PostgreSQL service
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: |
          psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'ALTER SYSTEM SET log_autovacuum_min_duration=0'
          psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'SELECT pg_reload_conf()'
      - name: Native employee, closed payroll, independent fiscal facts, recovery and full mobile F931
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
          MC_QA_LOCK_OBSERVATION: '1'
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: node scripts/verify-own-fiscal-facts.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --browser=chromium --output=verification/own-fiscal-facts-pg${{ matrix.pg }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-fiscal-facts-pg${{ matrix.pg }}-${{ github.run_id }}
          path: |
            verification/own-fiscal-facts-pg${{ matrix.pg }}
            verification/payroll-formula-transport/fragmented-regression
            verification/release-chromium-157.0.8098.0/installation.json
          retention-days: 5
