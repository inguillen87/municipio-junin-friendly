name: Own payroll day quantities
on:
  pull_request:
    paths: ['assets/native-salary*', 'assets/own-payroll-engine.js', 'assets/own-payroll-program*', 'src/islands/NativeSalaryCatalog.jsx', 'scripts/verify-salary-day-units.mjs', 'scripts/verify-own-contract-working-time.mjs', 'scripts/prepare-salary-day-units-installation.mjs', 'scripts/lib/salary-day-units*', 'scripts/migrations/166-own-payroll-day-units.sql', 'tests/salary-day-units*', 'docs/CANTIDADES_EN_DIAS_NOMINA_PROPIA.md', '.vercelignore', '.github/workflows/salary-day-units.yml']
  push:
    branches: ['master']
    paths: ['assets/native-salary*', 'assets/own-payroll-engine.js', 'assets/own-payroll-program*', 'src/islands/NativeSalaryCatalog.jsx', 'scripts/verify-salary-day-units.mjs', 'scripts/verify-own-contract-working-time.mjs', 'scripts/prepare-salary-day-units-installation.mjs', 'scripts/lib/salary-day-units*', 'scripts/migrations/166-own-payroll-day-units.sql', 'tests/salary-day-units*', 'docs/CANTIDADES_EN_DIAS_NOMINA_PROPIA.md', '.vercelignore', '.github/workflows/salary-day-units.yml']
permissions:
  contents: read
concurrency:
  group: salary-days-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare the existing disposable QA database
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - run: npx --no-install playwright install-deps chromium
      - name: Use the project browser admitted for release verification
        run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Exact day quantities, legacy compatibility, SQL conservation and desktop/mobile product
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-salary-day-units.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --browser=chromium --output=verification/salary-day-units-pg${{ matrix.pg }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: salary-day-units-pg${{ matrix.pg }}-${{ github.sha }}
          path: |
            verification/salary-day-units-pg${{ matrix.pg }}/result.json
            verification/salary-day-units-pg${{ matrix.pg }}/partial-checks.json
            verification/salary-day-units-pg${{ matrix.pg }}/failure.txt
            verification/salary-day-units-pg${{ matrix.pg }}/day-units-proof.json
            verification/salary-day-units-pg${{ matrix.pg }}/day-units-browser-proof.json
            verification/salary-day-units-pg${{ matrix.pg }}/*.png
          retention-days: 5
