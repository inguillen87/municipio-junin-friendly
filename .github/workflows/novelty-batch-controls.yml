name: Novelty batch controls
on:
  push:
    branches: ['codex/novelty-batch-controls-20260919', 'internal-native-family-schooling-20260922', 'master']
    paths:
      - 'novedades-nomina.html'
      - 'assets/payroll-novelty-workbench.js'
      - 'assets/payroll-novelty-txt*'
      - 'scripts/verify-novelty-txt-browser.mjs'
      - 'tests/payroll-novelty-txt.test.js'
      - 'assets/payroll-native-monthly-model.js'
      - 'assets/internal-capability-gate.js'
      - 'assets/app-routes.js'
      - 'scripts/build-friendly.mjs'
      - 'scripts/lib/published-build-verification.mjs'
      - 'assets/payroll-novelty-review*'
      - 'tests/novelty-batch-control.test.js'
      - 'scripts/verify-novelty-batch-controls.mjs'
      - '.github/workflows/novelty-batch-controls.yml'
  pull_request:
    paths:
      - 'assets/payroll-novelty*'
      - 'novedades-nomina.html'
      - 'sw.js'
      - 'scripts/verify-novelty*'
      - 'tests/payroll-novelty*'
      - '.github/workflows/novelty-batch-controls.yml'
permissions:
  contents: read
concurrency:
  group: novelty-batch-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Candidate full regression and build
        if: github.ref != 'refs/heads/master'
        run: npm run build
      - name: Reproduce promoted build
        if: github.ref == 'refs/heads/master'
        run: node scripts/build-friendly.mjs
      - run: npx playwright install --with-deps chromium
      - name: Existing entry modes, retries and permission regression
        if: github.ref != 'refs/heads/master'
        run: node scripts/verify-novelty-review-056.mjs
      - name: Full workbench with synthetic requests
        if: github.ref != 'refs/heads/master'
        run: node scripts/verify-novelty-batch-controls.mjs
      - name: Verify publication and exercise published workbench
        if: github.ref == 'refs/heads/master'
        run: node scripts/verify-novelty-batch-controls.mjs --published
      - name: TXT import, exact rows and existing creation contract
        env:
          NOVELTY_LIVE_ASSETS: ${{ github.ref == 'refs/heads/master' && '1' || '0' }}
        run: |
          if [ "$NOVELTY_LIVE_ASSETS" = "1" ]; then node scripts/verify-novelty-production-056.mjs; fi
          node scripts/verify-novelty-txt-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelty-batch-controls-${{ github.run_id }}
          path: |
            verification/novelty-batch-controls-*/**
            verification/novelty-056/browser.json
            verification/novelty-txt*/browser.json
            verification/novelty-txt*/txt-390.png
          retention-days: 3
