name: Working time and full roster adoption
on:
  pull_request:
    paths: ['lib/internal-employment-adoption.js', 'scripts/migrations/163-own-contract-working-time.sql', 'scripts/migrations/164-own-working-time-program-source.sql', 'scripts/migrations/165-working-time-adoption-readiness.sql', 'scripts/lib/working-time-adoption-readiness.mjs', 'scripts/lib/own-contract-working-time*', 'scripts/lib/operational-contract-adoption*', 'scripts/verify-working-time-adoption-readiness.mjs', 'scripts/prepare-working-time-adoption-readiness.mjs', 'tests/working-time-adoption-readiness.test.js', '.github/workflows/working-time-adoption-readiness.yml']
  push:
    branches: ['master']
    paths: ['lib/internal-employment-adoption.js', 'scripts/migrations/163-own-contract-working-time.sql', 'scripts/migrations/164-own-working-time-program-source.sql', 'scripts/migrations/165-working-time-adoption-readiness.sql', 'scripts/lib/working-time-adoption-readiness.mjs', 'scripts/lib/own-contract-working-time*', 'scripts/lib/operational-contract-adoption*', 'scripts/verify-working-time-adoption-readiness.mjs', 'scripts/prepare-working-time-adoption-readiness.mjs', 'tests/working-time-adoption-readiness.test.js', '.github/workflows/working-time-adoption-readiness.yml']
permissions:
  contents: read
concurrency:
  group: working-time-adoption-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare the existing disposable synthetic database
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - name: Reproduce503, repair metadata, independently adopt855 and preserve history
        run: node scripts/verify-working-time-adoption-readiness.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --output=verification/working-time-adoption-pg${{ matrix.pg }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: working-time-adoption-pg${{ matrix.pg }}-${{ github.sha }}
          path: verification/working-time-adoption-pg${{ matrix.pg }}/
          retention-days: 5
