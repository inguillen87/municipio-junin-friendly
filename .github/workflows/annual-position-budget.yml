name: Annual position budget
on:
  push:
    branches: ['master', 'codex/annual-position-budget-20261006']
    paths: ['assets/annual-position-budget*', 'estructura.html', 'api/internal-annual-position-budget.js', 'lib/internal-annual-position-budget.js', 'scripts/migrations/127-*', 'scripts/*annual-position-budget*.mjs', 'scripts/lib/annual-position-budget*.mjs', 'tests/annual-position-budget*.test.js', 'tests/fixtures/annual-position-budget-synthetic.js', 'scripts/build-friendly.mjs', '.vercelignore', '.github/workflows/annual-position-budget.yml']
  pull_request:
    paths: ['assets/annual-position-budget*', 'estructura.html', 'api/internal-annual-position-budget.js', 'lib/internal-annual-position-budget.js', 'scripts/migrations/127-*', 'scripts/*annual-position-budget*.mjs', 'scripts/lib/annual-position-budget*.mjs', 'tests/annual-position-budget*.test.js', 'tests/fixtures/annual-position-budget-synthetic.js', 'scripts/build-friendly.mjs', '.vercelignore', '.github/workflows/annual-position-budget.yml']
permissions:
  contents: read
jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        major: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.major }}
        env:
          POSTGRES_DB: own_payroll_run_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: annual-budget-synthetic-qa
        ports:
          - 554${{ matrix.major }}:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: annual-budget-synthetic-qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p verification
      - run: psql -h 127.0.0.1 -p 554${{ matrix.major }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOSUPERUSER NOBYPASSRLS;'
      - run: node --test tests/annual-position-budget*.test.js tests/internal-budget-approved.test.js tests/budget-structure*.test.js tests/budget-payroll*.test.js
      - run: node scripts/verify-annual-position-budget.mjs --major=${{ matrix.major }} --output=verification/annual-budget-sql.json
      - run: node scripts/verify-annual-position-budget-installation.mjs --major=${{ matrix.major }} --source-commit=${{ github.sha }} --output=verification/annual-budget-installation.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-annual-position-budget-ui.mjs --major=${{ matrix.major }} --browser=chromium --output=verification/annual-budget-ui.json
