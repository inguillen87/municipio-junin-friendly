name: Payroll live closure diagnostics
on:
  push:
    branches: ['fix/payroll-048-live-20260911']
permissions:
  contents: read
concurrency:
  group: payroll-live-closure
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p verification
      - run: npm ci
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/tests.log
      - name: Build
        run: node scripts/build-friendly.mjs
      - name: Public asset diagnosis
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import {createHash} from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const paths=['assets/payroll-detail-panel.js','assets/payroll-detail-model.js','assets/payroll-detail-export.js','assets/payroll-detail-panel.css','assets/legajo-workspace.js','internal-dashboard.html'];
          const result=[];
          for(const p of paths){try{const r=await fetch('https://municipio-junin-friendly.vercel.app/'+p+'?check='+process.env.GITHUB_SHA,{signal:AbortSignal.timeout(12000)});const b=Buffer.from(await r.arrayBuffer());const text=b.toString();result.push({path:p,status:r.status,contentType:r.headers.get('content-type'),expected:hash(fs.readFileSync(p)),actual:hash(b),bytes:b.length,detailButton:text.includes('Ver conceptos y descuentos'),payrollResource:text.includes('employeepayrolldetail'),activeRoster:text.includes('id="workforceWorkspace"'),activeDefault:text.includes('<option value="administrative_active" selected>')});}catch{result.push({path:p,error:'REQUEST_FAILED'});}}
          fs.writeFileSync('verification/public-assets.json',JSON.stringify(result,null,2)); console.log(JSON.stringify(result));
          NODE
      - name: Archive exact tracked source
        if: always()
        run: git archive --format=tar.gz -o verification/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payroll-live-closure
          path: verification/
          retention-days: 3
