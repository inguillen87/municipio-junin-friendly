name: Payroll live closure diagnostics
on:
  push:
    branches: ['fix/payroll-048-live-20260911']
permissions:
  contents: read
concurrency:
  group: payroll-live-closure
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p verification
      - run: npm ci
      - name: Reproduce original source packaging
        run: node scripts/verify-vercel-source-package.mjs
      - name: Repair exact missing source and verify packaged build
        run: node scripts/verify-vercel-source-package.mjs --fix
      - name: Full source tests and build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee verification/tests.log
      - run: npx playwright install --with-deps chromium
      - name: Detail and active roster browser regression
        run: |
          node scripts/verify-payroll-detail-browser.mjs
          node scripts/verify-workforce-operations-browser.mjs
      - name: Commit validated packaging repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .vercelignore
          if ! git diff --cached --quiet; then
            git commit -m 'fix(build): retain audited payroll migration required by production tests'
            git push origin HEAD:fix/payroll-048-live-20260911
          fi
          git rev-parse HEAD > verification/validated-commit.txt
      - name: Archive tracked source
        if: always()
        run: git archive --format=tar.gz -o verification/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payroll-live-closure
          path: verification/
          retention-days: 3
