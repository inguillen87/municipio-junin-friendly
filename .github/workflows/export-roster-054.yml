name: Export roster F-M acceptance
on:
  push:
    branches: ['feat/export-roster-054']
permissions:
  contents: read
concurrency:
  group: export-roster-054
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: mkdir -p verification
      - name: Integrate source and verify repeatability
        run: |
          node scripts/integrate-export-roster.mjs
          node scripts/refine-roster-acceptance.mjs
          git diff | sha256sum > /tmp/first
          node scripts/integrate-export-roster.mjs
          node scripts/refine-roster-acceptance.mjs
          git diff | sha256sum > /tmp/second
          diff /tmp/first /tmp/second
      - run: npm ci
      - name: Full tests and build
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/all-tests.log
          node scripts/build-friendly.mjs 2>&1 | tee verification/build.log
      - run: npx playwright install --with-deps chromium
      - name: Roster downloads and data integrity
        run: |
          set -o pipefail
          node scripts/verify-export-roster-browser.mjs 2>&1 | tee verification/roster-browser.log
      - run: node scripts/verify-report-centre-browser.mjs
      - run: node scripts/verify-report-summary-shell.mjs
      - name: Commit only validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/internal-data.js lib/internal-resource-access.js assets/payroll-source-reports.js scripts/build-friendly.mjs assets/report-document.js assets/report-centre.css .vercelignore scripts/verify-export-roster-browser.mjs scripts/verify-report-centre-browser.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'feat(exportables): integrate source roster and F-M export workflow'
            git push origin HEAD:feat/export-roster-054
          fi
          git rev-parse HEAD > verification/validated-commit.txt
      - name: Archive tracked source
        if: always()
        run: git archive --format=tar.gz -o verification/export-roster-source.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: export-roster-054-verification
          path: verification/
          retention-days: 5
