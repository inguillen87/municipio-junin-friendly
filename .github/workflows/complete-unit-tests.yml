name: Complete unit tests
# Corre una sola vez por cambio el conjunto completo de pruebas unitarias. Los laboratorios (base de datos y navegador)
# arman el producto con `npm run build:lab`, que ya no repite este conjunto en cada uno: antes cada laboratorio gastaba
# unos 18 de sus 20 minutos en volver a correrlo.
on:
  push:
    branches: ['master']
  pull_request:
permissions:
  contents: read
concurrency:
  group: complete-unit-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
