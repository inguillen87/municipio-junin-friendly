name: PM10 delivery 059.2
on:
  push:
    branches: ['feat/pm10-delivery-0592', 'master']
    paths: ['.github/workflows/pm10-delivery-0592.yml', 'local-agents/pm10/**', 'api/attendance-pm10.js', 'api/internal-attendance.js', 'lib/internal-pm10-*', 'assets/pm10-*', 'relojes-marcaciones.html', 'scripts/migrations/055-pm10-continuous-delivery.sql', 'scripts/verify-pm10-*', 'tests/pm10-delivery.test.js']
permissions:
  contents: read
concurrency:
  group: pm10-delivery-0592-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-agent:
    if: github.ref != 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed source patch if not integrated yet
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f local-agents/pm10/delivery.mjs ]; then
            curl --fail --silent --show-error --max-time 60 -o /tmp/0592.patch.gz 'https://res.cloudinary.com/dkvzi1mrc/raw/upload/v1789302737/municontrol-code-transfer/pm10-0592-929ebd75.patch.gz'
            echo '929ebd75d2a3f03f56862465674258e3e11c665bbfedcf0b16e492697abdd042  /tmp/0592.patch.gz' | sha256sum --check -
            gzip -dc /tmp/0592.patch.gz > /tmp/0592.patch
            git apply --check /tmp/0592.patch
            git apply /tmp/0592.patch
          fi
      - name: Collector tests - synthetic routes only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          node --test local-agents/pm10/tests/*.test.mjs 2>&1 | tee verification/windows-collector.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pm10-0592-windows
          path: verification/
          retention-days: 5
  validate:
    if: github.ref != 'refs/heads/master'
    needs: windows-agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p verification
      - name: Apply reviewed source patch if not integrated yet
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f local-agents/pm10/delivery.mjs ]; then
            curl --fail --silent --show-error --max-time 60 -o /tmp/0592.patch.gz 'https://res.cloudinary.com/dkvzi1mrc/raw/upload/v1789302737/municontrol-code-transfer/pm10-0592-929ebd75.patch.gz'
            echo '929ebd75d2a3f03f56862465674258e3e11c665bbfedcf0b16e492697abdd042  /tmp/0592.patch.gz' | sha256sum --check -
            gzip -dc /tmp/0592.patch.gz > /tmp/0592.patch
            git apply --check /tmp/0592.patch
            git apply /tmp/0592.patch
          fi
      - run: npm ci
      - name: Full application and collector regression
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee verification/application-tests.log
          node scripts/build-friendly.mjs 2>&1 | tee verification/build.log
          node --test local-agents/pm10/tests/*.test.mjs 2>&1 | tee verification/collector-tests.log
      - run: npx playwright install --with-deps chromium
      - name: Published-style clock interface and existing payroll regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-pm10-continuous.mjs 2>&1 | tee verification/pm10-browser.log
          node scripts/verify-payroll-summary-055.mjs 2>&1 | tee verification/summary-browser.log
          node scripts/verify-novelty-review-056.mjs 2>&1 | tee verification/novelty-browser.log
      - name: Commit only validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .vercelignore api/attendance-pm10.js api/internal-attendance.js lib/internal-pm10-delivery.js lib/internal-pm10-status.js assets/pm10-continuous.js assets/pm10-continuous.css local-agents/pm10 docs/SPRINT_059_2_RECEPCION_CONTINUA.md relojes-marcaciones.html scripts/build-friendly.mjs scripts/migrations/055-pm10-continuous-delivery.sql scripts/verify-pm10-continuous.mjs scripts/verify-pm10-production.mjs tests/pm10-delivery.test.js
          if ! git diff --cached --quiet; then
            git commit -m 'feat(pm10): durable acknowledged delivery and authenticated continuous reception view'
            git push origin HEAD:feat/pm10-delivery-0592
          fi
          git rev-parse HEAD > verification/validated-commit.txt
      - name: Archive source and evidence only
        if: always()
        run: |
          git diff HEAD > verification/pending-source.patch
          git archive --format=tar.gz -o verification/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pm10-delivery-0592-acceptance
          path: verification/
          retention-days: 5
  production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-pm10-production.mjs
      - name: Published assets, synthetic API responses only
        env:
          PM10_LIVE_ASSETS: '1'
        run: node scripts/verify-pm10-continuous.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pm10-0592-production
          path: verification/
          retention-days: 5
