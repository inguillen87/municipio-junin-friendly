name: Legajo summary PDF 055
on:
  push:
    branches: ['fix/legajo-pdf-055', 'master']
    paths:
      - '.github/workflows/payroll-summary-055.yml'
      - 'scripts/patches/055.patch.b64.*'
      - 'assets/payroll-summary*'
      - 'assets/payroll-history-055.css'
      - 'internal-dashboard.html'
      - 'scripts/verify-payroll-summary*'
      - 'scripts/payroll-summary-synthetic.mjs'
      - 'tests/payroll-summary-055.test.js'
permissions:
  contents: read
concurrency:
  group: payroll-summary-055-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p verification
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          if test -f scripts/patches/055.patch.b64.1; then
            node --input-type=module -e 'import fs from "node:fs"; const parts=[1,2,3].map(n=>fs.readFileSync("scripts/patches/055.patch.b64."+n,"utf8")); console.log("Staged chunk lengths:",parts.map(s=>s.length)); const encoded=parts.join("").replace(/\s/g,""); if(!/^[A-Za-z0-9+/]*={0,2}$/.test(encoded)||encoded.length%4!==0)throw Error("INVALID_PATCH_ENCODING"); fs.writeFileSync("/tmp/055.patch.gz",Buffer.from(encoded,"base64"));'
            echo 'd7aa682932fd105e50d1cf55aadfc37d46c2b547a7b454568decc0f74cc1d2af  /tmp/055.patch.gz' | sha256sum --check -
            gzip -dc /tmp/055.patch.gz > /tmp/055.patch
            git apply --check /tmp/055.patch
            git apply /tmp/055.patch
          fi
      - run: npm ci
      - name: Full unit tests and build
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee verification/all-tests.log
          node scripts/build-friendly.mjs 2>&1 | tee verification/build.log
      - run: npx playwright install --with-deps chromium
      - name: Reproduce real DTO, missing amounts, year filters and downloads
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-payroll-summary-055.mjs 2>&1 | tee verification/summary-browser.log
      - name: Legajo, report centre and F-M export regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-report-summary-shell.mjs 2>&1 | tee verification/summary-shell.log
          node scripts/verify-document-library-legajo.mjs 2>&1 | tee verification/library-shell.log
          node scripts/verify-report-centre-browser.mjs 2>&1 | tee verification/report-centre.log
          node scripts/verify-export-roster-browser.mjs 2>&1 | tee verification/roster.log
      - name: Commit only validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/payroll-history-055.css assets/payroll-summary-model.js assets/payroll-summary-pdf.js docs/SPRINT_055_PDF_HISTORIAL.md internal-dashboard.html scripts/build-friendly.mjs scripts/payroll-summary-synthetic.mjs scripts/verify-document-library-legajo.mjs scripts/verify-payroll-summary-055.mjs scripts/verify-payroll-summary-production-055.mjs tests/payroll-summary-055.test.js
          if test -f scripts/patches/055.patch.b64.1; then git rm scripts/patches/055.patch.b64.{1,2,3}; fi
          if ! git diff --cached --quiet; then
            git commit -m 'fix(055): repair real legajo PDF identity and missing amounts; improve history UX'
            git push origin HEAD:fix/legajo-pdf-055
          fi
          git rev-parse HEAD > verification/validated-commit.txt
      - name: Archive evidence and source
        if: always()
        shell: bash
        run: |
          git diff > verification/pending-changes.patch
          git archive --format=tar.gz -o verification/summary-055-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-055-acceptance
          path: verification/
          retention-days: 5
  production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Match published source bytes and verify anonymous rejection
        run: node scripts/verify-payroll-summary-production-055.mjs
      - name: Download through production UI with synthetic API only
        env:
          SUMMARY_LIVE_ASSETS: '1'
        run: node scripts/verify-payroll-summary-055.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-055-production-verification
          path: verification/
          retention-days: 5
