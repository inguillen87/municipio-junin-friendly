name: Own period participation
on:
  pull_request:
    paths: ['scripts/lib/qa-run-capture-lock.mjs', 'tests/qa-run-capture-lock.test.js', 'scripts/own-art-tested-build.mjs', 'tests/own-art-tested-build.test.js', '.github/workflows/own-art.yml', 'assets/release-status-model.js', 'scripts/install-project-chromium.mjs', 'scripts/lib/project-chromium.mjs', 'scripts/lib/patched-chromium-diagnostic-manifest.mjs', 'scripts/verify-source-preview-fragmented-transport.mjs', 'docs/QA_CHROMIUM_VERIFIED_20261011.md', 'tests/project-chromium-workflow.test.js', 'lib/own-period-read-recovery.js', 'tests/own-period-read-recovery.test.js', 'tests/own-period-read-recovery-delay.test.js', 'scripts/lib/own-period-read-delay-qa.mjs', 'scripts/verify-own-period-read-delay.mjs', 'scripts/lib/own-period-read-contention-qa.mjs', '.vercelignore', 'scripts/verify-own-salary-seniority.mjs', 'scripts/lib/own-salary-seniority*', 'scripts/lib/adopted-consumers-installation-pins.mjs', 'api/internal-own-period-participation.js', 'assets/own-period-participation*', 'assets/own-payroll*.js', 'assets/payroll-navigation.js', 'lib/internal-own-period-participation.js', 'lib/own-payroll-approved-input.js', 'lib/internal-own-payroll-run.js', 'scripts/build-friendly.mjs', 'scripts/verify-own-period-participation.mjs', 'scripts/verify-salary-auxiliary-namespace.mjs', 'scripts/lib/own-period-participation*', 'scripts/lib/period-participation-qa-reference.mjs', 'scripts/lib/salary-auxiliary-namespace-browser.mjs', 'scripts/migrations/157-own-period-participation.sql', 'tests/own-period-participation*', 'tests/fixtures/own-period-participation-synthetic.js', 'scripts/migrations/161-own-participation-command-guard.sql', 'scripts/migrations/162-own-seniority-command-guard.sql', 'scripts/lib/own-participation-command-guard*', 'scripts/verify-own-participation-command-guard.mjs', 'tests/own-participation-command-guard*', 'scripts/verify-own-fiscal-facts.mjs', 'docs/NOELIA_PARTICIPACION_ESPERA_ACOTADA_20261011.md', '.github/workflows/own-period-participation.yml']
  push:
    branches: ['master']
    paths: ['scripts/lib/qa-run-capture-lock.mjs', 'tests/qa-run-capture-lock.test.js', 'scripts/own-art-tested-build.mjs', 'tests/own-art-tested-build.test.js', '.github/workflows/own-art.yml', 'assets/release-status-model.js', 'scripts/install-project-chromium.mjs', 'scripts/lib/project-chromium.mjs', 'scripts/lib/patched-chromium-diagnostic-manifest.mjs', 'scripts/verify-source-preview-fragmented-transport.mjs', 'docs/QA_CHROMIUM_VERIFIED_20261011.md', 'tests/project-chromium-workflow.test.js', 'lib/own-period-read-recovery.js', 'tests/own-period-read-recovery.test.js', 'tests/own-period-read-recovery-delay.test.js', 'scripts/lib/own-period-read-delay-qa.mjs', 'scripts/verify-own-period-read-delay.mjs', 'scripts/lib/own-period-read-contention-qa.mjs', '.vercelignore', 'scripts/verify-own-salary-seniority.mjs', 'scripts/lib/own-salary-seniority*', 'scripts/lib/adopted-consumers-installation-pins.mjs', 'api/internal-own-period-participation.js', 'assets/own-period-participation*', 'assets/own-payroll*.js', 'assets/payroll-navigation.js', 'lib/internal-own-period-participation.js', 'lib/own-payroll-approved-input.js', 'lib/internal-own-payroll-run.js', 'scripts/build-friendly.mjs', 'scripts/verify-own-period-participation.mjs', 'scripts/verify-salary-auxiliary-namespace.mjs', 'scripts/lib/own-period-participation*', 'scripts/lib/period-participation-qa-reference.mjs', 'scripts/lib/salary-auxiliary-namespace-browser.mjs', 'scripts/migrations/157-own-period-participation.sql', 'tests/own-period-participation*', 'tests/fixtures/own-period-participation-synthetic.js', 'scripts/migrations/161-own-participation-command-guard.sql', 'scripts/migrations/162-own-seniority-command-guard.sql', 'scripts/lib/own-participation-command-guard*', 'scripts/verify-own-participation-command-guard.mjs', 'tests/own-participation-command-guard*', 'scripts/verify-own-fiscal-facts.mjs', 'docs/NOELIA_PARTICIPACION_ESPERA_ACOTADA_20261011.md', '.github/workflows/own-period-participation.yml']
permissions:
  contents: read
concurrency:
  group: own-period-participation-${{ github.ref }}
  cancel-in-progress: true
env:
  ART_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  tested_build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      manifest_sha: ${{ steps.custody.outputs['manifest-sha'] }}
      artifact_id: ${{ steps.shared_upload.outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refuse ambient database and private build inputs
        run: node scripts/lib/own-period-participation-tested-build.mjs preflight
      - name: Complete general tests and build once for both PostgreSQL consumers
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/own-period-general-build.log"
      - name: Seal all tested public bytes under the current source and run
        id: custody
        run: node scripts/lib/own-period-participation-tested-build.mjs create
      - name: Upload the exact current-run tested public envelope
        id: shared_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: own-period-tested-public-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/own-period-tested-public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5
      - name: Require the immutable uploaded artifact identifier
        shell: bash
        env:
          PERIOD_UPLOADED_ARTIFACT_ID: ${{ steps.shared_upload.outputs['artifact-id'] }}
        run: |
          set -euo pipefail
          [[ "$PERIOD_UPLOADED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Preserve general build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: own-period-general-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/own-period-general-build.log
          if-no-files-found: warn
          retention-days: 5
  verify:
    needs: tested_build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Fail closed when the producer did not finish successfully
        if: ${{ always() && (needs.tested_build.result != 'success' || cancelled()) }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download only the immutable artifact emitted by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.tested_build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/own-period-tested-public
      - name: Verify source, runtime, same-run identity and every public byte before use
        env:
          PERIOD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: node scripts/lib/own-period-participation-tested-build.mjs verify
      - run: mkdir -p verification
      - run: npx playwright install --with-deps chromium
      - run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Prepare disposable PostgreSQL with the original runtime restrictions
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - name: Actual declaration, independent review, exact capture, payroll and mobile UI
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
          MC_QA_LOCK_OBSERVATION: 1
        run: node scripts/verify-own-period-participation.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --browser=chromium --output=verification/own-period-participation-pg${{ matrix.pg }}
      - name: Native fragmented EOF and unchanged rejection guards
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-source-preview-fragmented-transport.mjs
      - name: Brief occupied reads recover through actual SQL and the original mobile circuit
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: node --import ./scripts/lib/project-chromium.mjs scripts/verify-own-period-read-delay.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --browser=chromium --output=verification/own-period-read-delay-pg${{ matrix.pg }}
      - name: Both command deadlines, durable upgrade, expiry and withdrawn authority
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: node --import ./scripts/lib/project-chromium.mjs scripts/verify-own-participation-command-guard.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --output=verification/participation-command-guard-pg${{ matrix.pg }} --browser=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-period-participation-pg${{ matrix.pg }}-${{ github.run_id }}
          path: |
            verification/own-period-participation-pg${{ matrix.pg }}
            verification/participation-command-guard-pg${{ matrix.pg }}
            verification/own-period-read-delay-pg${{ matrix.pg }}
            verification/release-chromium-157.0.8098.0/installation.json
            verification/payroll-formula-transport/fragmented-regression
          retention-days: 5
