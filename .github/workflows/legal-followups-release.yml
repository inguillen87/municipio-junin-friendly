name: Legal follow-ups release
on:
  pull_request:
    branches: ['master']
    paths:
      - 'api/internal-legal-followups.js'
      - 'assets/legal-followups*'
      - 'internal-legal-followups.html'
      - 'scripts/migrations/079-native-legal-followups.sql'
      - 'scripts/verify-legal-followups-browser.mjs'
      - 'tests/legal-followups*.test.js'
      - '.github/workflows/legal-followups-release.yml'
permissions:
  contents: read
concurrency:
  group: legal-followups-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-legal-followups-browser.mjs
      - run: node scripts/verify-legal-registry-browser.mjs
      - run: node scripts/verify-documentary-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legal-followups-synthetic-qa
          path: |
            verification/legal-followups-local/**
            verification/legal-registry-local/result.json
            verification/documentary-review-local/result.json
          retention-days: 3
