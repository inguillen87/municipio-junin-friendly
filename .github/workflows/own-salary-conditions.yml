name: Own salary conditions and complete results
on:
  pull_request:
    paths: ['scripts/lib/ci-tested-build.mjs', 'tests/ci-tested-build.test.js', 'scripts/own-art-tested-build.mjs', 'tests/own-art-tested-build.test.js', '.github/workflows/own-art.yml', 'assets/release-status-model.js', 'package.json', 'package-lock.json', '.nvmrc', 'assets/own-contract-salary-conditions*', 'assets/own-payroll*', 'assets/payroll-navigation.js', 'api/internal-own*', 'lib/internal-own*', 'lib/own-payroll*', 'scripts/verify-own-contract-salary-conditions.mjs', 'scripts/verify-own-salary-conditions-program.mjs', 'scripts/prepare-own-contract-salary-conditions-installation.mjs', 'scripts/lib/own-contract-salary-conditions*', 'scripts/lib/own-salary-conditions*', 'scripts/lib/own-payroll-full*', 'scripts/lib/own-synthetic-browser.mjs', 'scripts/migrations/171-own-contract-salary-conditions.sql', 'scripts/migrations/172-own-salary-conditions-program-source.sql', 'scripts/migrations/173-own-full-payroll-response.sql', 'scripts/build-friendly.mjs', 'tests/own-contract-salary-conditions*', 'tests/own-payroll-conditions*', 'tests/own-payroll-full*', 'tests/own-payroll-response*', '.github/workflows/own-salary-conditions.yml']
  push:
    branches: ['master']
    paths: ['scripts/lib/ci-tested-build.mjs', 'tests/ci-tested-build.test.js', 'scripts/own-art-tested-build.mjs', 'tests/own-art-tested-build.test.js', '.github/workflows/own-art.yml', 'assets/release-status-model.js', 'package.json', 'package-lock.json', '.nvmrc', 'assets/own-contract-salary-conditions*', 'assets/own-payroll*', 'assets/payroll-navigation.js', 'api/internal-own*', 'lib/internal-own*', 'lib/own-payroll*', 'scripts/verify-own-contract-salary-conditions.mjs', 'scripts/verify-own-salary-conditions-program.mjs', 'scripts/prepare-own-contract-salary-conditions-installation.mjs', 'scripts/lib/own-contract-salary-conditions*', 'scripts/lib/own-salary-conditions*', 'scripts/lib/own-payroll-full*', 'scripts/lib/own-synthetic-browser.mjs', 'scripts/migrations/171-own-contract-salary-conditions.sql', 'scripts/migrations/172-own-salary-conditions-program-source.sql', 'scripts/migrations/173-own-full-payroll-response.sql', 'scripts/build-friendly.mjs', 'tests/own-contract-salary-conditions*', 'tests/own-payroll-conditions*', 'tests/own-payroll-full*', 'tests/own-payroll-response*', '.github/workflows/own-salary-conditions.yml']
permissions:
  contents: read
concurrency:
  group: salary-conditions-${{ github.ref }}
  cancel-in-progress: true
env:
  ART_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  tested_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      manifest_sha: ${{ steps.custody.outputs['manifest-sha'] }}
      artifact_id: ${{ steps.shared_upload.outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refuse ambient database and optional local test inputs
        run: node scripts/lib/ci-tested-build.mjs preflight own-salary-conditions
      - name: Complete original general tests and build once for this matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/ci-tested-build-own-salary-conditions.log"
      - name: Seal tested public bytes with exact source and current-run identity
        id: custody
        run: node scripts/lib/ci-tested-build.mjs create own-salary-conditions
      - name: Upload immutable current-run tested public bytes
        id: shared_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tested-public-own-salary-conditions-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-tested-public-own-salary-conditions/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5
      - name: Require the immutable uploaded artifact identifier
        shell: bash
        env:
          CI_BUILD_ARTIFACT_ID: ${{ steps.shared_upload.outputs['artifact-id'] }}
        run: |
          set -euo pipefail
          [[ "$CI_BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Preserve complete general build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tested-build-own-salary-conditions-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-tested-build-own-salary-conditions.log
          if-no-files-found: warn
          retention-days: 5
  verify:
    needs: tested_build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Fail closed when the full-suite producer did not succeed
        if: ${{ always() && (needs.tested_build.result != 'success' || cancelled()) }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require exact producer outputs before downloading
        shell: bash
        env:
          CI_BUILD_ARTIFACT_ID: ${{ needs.tested_build.outputs.artifact_id }}
          CI_BUILD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          [[ "$CI_BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CI_BUILD_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - name: Download only the immutable artifact emitted by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.tested_build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci-tested-public-own-salary-conditions
      - name: Verify exact source, runtime, run and every public byte before use
        env:
          CI_BUILD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: node scripts/lib/ci-tested-build.mjs verify own-salary-conditions
      - name: Prepare disposable synthetic PostgreSQL
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - run: npx --no-install playwright install-deps chromium
      - name: Use the existing project browser for release verification
        run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Atomic installation, complete declarations, exact typed calculation and all three mobile screens
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-own-salary-conditions-program.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --browser=chromium --output=verification/salary-conditions-pg${{ matrix.pg }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: salary-conditions-pg${{ matrix.pg }}-${{ github.sha }}
          path: |
            verification/salary-conditions-pg${{ matrix.pg }}/result.json
            verification/salary-conditions-pg${{ matrix.pg }}/*proof.json
            verification/salary-conditions-pg${{ matrix.pg }}/partial-checks.json
            verification/salary-conditions-pg${{ matrix.pg }}/failure.txt
            verification/salary-conditions-pg${{ matrix.pg }}/*.png
            verification/release-chromium-157.0.8098.0/installation.json
          retention-days: 5
