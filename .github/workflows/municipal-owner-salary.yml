permissions:
  contents: read
concurrency:
  group: municipal-owner-salary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Municipal owner salary / PG${{ matrix.pg }} / ${{ matrix.baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
        baseline: [pre107, published107]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        # Startup probes establish readiness. The later interval exceeds this
        # job's complete deadline, preserving every zero-other-client guard.
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-start-interval 1s --health-start-period 30s --health-interval 1h --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:vercel
      - name: Prepare only the disposable synthetic service
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - run: npx --no-install playwright install-deps chromium
      - name: Install the admitted project Chromium before browser use
        run: |
          mkdir -p verification
          node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Complete canonical 188 authority, independent and owner decisions, SQL protocol and browser
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-municipal-owner-salary.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --operational-pair-baseline=${{ matrix.baseline }} --output=verification/owner-salary-pg${{ matrix.pg }}-${{ matrix.baseline }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: municipal-owner-salary-pg${{ matrix.pg }}-${{ matrix.baseline }}-${{ github.sha }}
          path: |
            verification/owner-salary-pg${{ matrix.pg }}-${{ matrix.baseline }}/*.json
            verification/owner-salary-pg${{ matrix.pg }}-${{ matrix.baseline }}/*failure.txt
            verification/owner-salary-pg${{ matrix.pg }}-${{ matrix.baseline }}/*.png
            verification/release-chromium-157.0.8098.0/installation.json
          retention-days: 5
