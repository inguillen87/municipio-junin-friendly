name: Public staff entry
on:
  push:
    branches: [master]
    paths: ['friendly-dashboard.html', 'assets/municontrol-enterprise.css', 'assets/app-routes.js', 'tests/executive-dashboard-focus.test.js', 'scripts/verify-public-entry-browser.mjs', 'scripts/build-friendly.mjs', '.github/workflows/public-entry.yml']
  pull_request:
    paths: ['friendly-dashboard.html', 'assets/municontrol-enterprise.css', 'assets/app-routes.js', 'tests/executive-dashboard-focus.test.js', 'scripts/verify-public-entry-browser.mjs', 'scripts/build-friendly.mjs', '.github/workflows/public-entry.yml']
permissions:
  contents: read
concurrency:
  group: public-entry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-public-entry-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-entry-fixture-browser
          path: verification/public-entry-browser/
          retention-days: 5
