permissions:
  contents: read
concurrency:
  group: payroll-administrative-operator-${{ github.ref }}
  cancel-in-progress: true
env:
  ART_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  tested_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      manifest_sha: ${{ steps.custody.outputs['manifest-sha'] }}
      artifact_id: ${{ steps.shared_upload.outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refuse ambient database and optional local test inputs
        run: node scripts/lib/ci-tested-build.mjs preflight own-payroll-administrative-operator
      - name: Complete original general tests and build once for this matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/ci-tested-build-own-payroll-administrative-operator.log"
      - name: Seal tested public bytes with exact source and current-run identity
        id: custody
        run: node scripts/lib/ci-tested-build.mjs create own-payroll-administrative-operator
      - name: Upload immutable current-run tested public bytes
        id: shared_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tested-public-own-payroll-administrative-operator-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-tested-public-own-payroll-administrative-operator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5
      - name: Require the immutable uploaded artifact identifier
        shell: bash
        env:
          CI_BUILD_ARTIFACT_ID: ${{ steps.shared_upload.outputs['artifact-id'] }}
        run: |
          set -euo pipefail
          [[ "$CI_BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Preserve complete general build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tested-build-own-payroll-administrative-operator-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-tested-build-own-payroll-administrative-operator.log
          if-no-files-found: warn
          retention-days: 5
  verify:
    needs: tested_build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Fail closed when the full-suite producer did not succeed
        if: ${{ always() && (needs.tested_build.result != 'success' || cancelled()) }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require exact producer outputs before downloading
        shell: bash
        env:
          CI_BUILD_ARTIFACT_ID: ${{ needs.tested_build.outputs.artifact_id }}
          CI_BUILD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          [[ "$CI_BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CI_BUILD_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - name: Download only the immutable artifact emitted by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.tested_build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci-tested-public-own-payroll-administrative-operator
      - name: Verify exact source, runtime, run and every public byte before use
        env:
          CI_BUILD_MANIFEST_SHA256: ${{ needs.tested_build.outputs.manifest_sha }}
        run: node scripts/lib/ci-tested-build.mjs verify own-payroll-administrative-operator
      - name: Prepare disposable synthetic PostgreSQL
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - name: Administrative identity, original attempts and complete payroll on synthetic loopback
        run: node scripts/verify-own-payroll-administrative-operator.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --output=verification/administrative-operator-pg${{ matrix.pg }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: administrative-operator-pg${{ matrix.pg }}-${{ github.sha }}
          path: |
            verification/administrative-operator-pg${{ matrix.pg }}/result.json
            verification/administrative-operator-pg${{ matrix.pg }}/*proof.json
            verification/administrative-operator-pg${{ matrix.pg }}/partial-checks.json
            verification/administrative-operator-pg${{ matrix.pg }}/failure.txt
            verification/administrative-operator-pg${{ matrix.pg }}/*failure.json
          retention-days: 5
