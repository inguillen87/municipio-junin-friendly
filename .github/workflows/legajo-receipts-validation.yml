name: Legajo and receipt validation
on:
  push:
    branches: ['feat/legajo-receipts-validation-20260910']
permissions:
  contents: read
concurrency:
  group: legajo-receipts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: mkdir -p verification
      - name: Install locked dependencies
        run: npm ci
      - name: Full repository tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/all-tests.log
      - name: Build application
        run: |
          set -o pipefail
          node scripts/build-friendly.mjs 2>&1 | tee verification/build.log
      - name: Archive exact source for review
        if: always()
        run: git archive --format=tar.gz -o verification/legajo-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legajo-validation
          path: verification/
          retention-days: 3
