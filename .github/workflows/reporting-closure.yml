name: MuniControl reporting and release acceptance
on:
  workflow_dispatch:
  push:
    branches: ['work/chat-close-20260923', 'master']
    paths: ['assets/budget-structure*', 'assets/report-centre.js', 'reportes-rrhh.html', 'administracion-plataforma.html', 'scripts/build-friendly.mjs', 'scripts/verify-budget-structure-browser.mjs', 'scripts/verify-chat-release-production.mjs', 'scripts/verify-report-centre-browser.mjs', 'tests/budget-structure.test.js', 'tests/admin-status-tone.test.js', '.github/workflows/reporting-closure.yml']
permissions:
  contents: read
concurrency:
  group: reporting-closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Complete tests and build
        run: |
          set -euo pipefail
          mkdir -p verification/reporting-closure
          npm run build 2>&1 | tee verification/reporting-closure/build.log
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-budget-structure-browser.mjs
      - run: node scripts/verify-report-centre-browser.mjs
      - run: node scripts/verify-legal-read-safety-browser.mjs
      - run: node scripts/verify-legal-alert-center-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporting-closure-qa
          path: |
            verification/reporting-closure/
            verification/budget-structure/
            verification/legal-read-safety/
            verification/legal-alert-center-local/
            verification/report-centre-browser.json
            verification/reports-library-desktop.png
          retention-days: 5
  production:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/verify-chat-release-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporting-closure-production
          path: verification/chat-release-production.json
          retention-days: 5
