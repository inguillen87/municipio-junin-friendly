name: Report centre production verification
on:
  push:
    branches: ['master']
permissions:
  contents: read
concurrency:
  group: report-centre-production
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: node scripts/build-friendly.mjs
      - run: node scripts/verify-report-centre-production.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-centre-production-verification
          path: verification/report-centre-production.json
          retention-days: 5
