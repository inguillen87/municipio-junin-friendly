name: Novelty directory selector 059
on:
  push:
    branches: ['feat/novelty-directory-059', 'master']
    paths:
      - '.github/workflows/novelty-directory-059.yml'
      - 'scripts/patches/059*'
      - 'assets/payroll-novelty-directory*'
      - 'assets/payroll-novelty-workbench.js'
      - 'assets/payroll-novelty-sheet.js'
      - 'novedades-nomina.html'
      - 'scripts/build-friendly.mjs'
      - 'sw.js'
      - 'scripts/verify-novelty-directory*'
      - 'tests/payroll-novelty-directory-059.test.js'
permissions:
  contents: read
concurrency:
  group: novelty-directory-059-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p verification
      - name: Apply reviewed directory patch
        shell: bash
        run: |
          set -euo pipefail
          if test -f scripts/patches/059.patch.b64.1; then
            node --input-type=module -e 'import fs from "node:fs"; const encoded=[1,2,3].map(n=>fs.readFileSync("scripts/patches/059.patch.b64."+n,"utf8")).join("").replace(/\s/g,""); if(!/^[A-Za-z0-9+/]*={0,2}$/.test(encoded)||encoded.length!==28468)throw Error("INVALID_PATCH_ENCODING"); fs.writeFileSync("/tmp/059.patch.gz",Buffer.from(encoded,"base64"));'
            echo '68d966eb3938ea61acdeed61c9b0f9bb237c4cde3fdd369127362d06164ff9af  /tmp/059.patch.gz' | sha256sum --check -
            gzip -dc /tmp/059.patch.gz > /tmp/059.patch
            git apply --check /tmp/059.patch
            git apply /tmp/059.patch
          fi
          if test -f scripts/patches/059.qa.patch; then
            git apply --check scripts/patches/059.qa.patch
            git apply scripts/patches/059.qa.patch
          fi
          git diff --check
      - run: npm ci
      - name: Full unit tests and build
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee verification/all-tests.log
          node scripts/build-friendly.mjs 2>&1 | tee verification/build.log
      - run: npx playwright install --with-deps chromium
      - name: Directory selection through all three real workbench modes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-novelty-directory-059.mjs 2>&1 | tee verification/directory-browser.log
      - name: Existing payroll, sheet, list, review and report regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-novelty-sheet-057.mjs 2>&1 | tee verification/sheet-browser.log
          node scripts/verify-novelty-list-057.mjs 2>&1 | tee verification/list-browser.log
          node scripts/verify-novelty-review-056.mjs 2>&1 | tee verification/review-browser.log
          node scripts/verify-payroll-comparison-056.mjs 2>&1 | tee verification/comparison-browser.log
          node scripts/verify-payroll-summary-055.mjs 2>&1 | tee verification/summary-browser.log
          node scripts/verify-report-summary-shell.mjs 2>&1 | tee verification/summary-shell.log
          node scripts/verify-document-library-legajo.mjs 2>&1 | tee verification/library-browser.log
          node scripts/verify-report-centre-browser.mjs 2>&1 | tee verification/reports-browser.log
          node scripts/verify-export-roster-browser.mjs 2>&1 | tee verification/roster-browser.log
      - name: Commit only validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/payroll-novelty-directory-model.js assets/payroll-novelty-directory.js assets/payroll-novelty-directory.css assets/payroll-novelty-workbench.js assets/payroll-novelty-sheet.js novedades-nomina.html scripts/build-friendly.mjs sw.js tests/payroll-novelty-directory-059.test.js scripts/verify-novelty-directory-059.mjs scripts/verify-novelty-directory-production-059.mjs docs/SPRINT_059_SELECTOR_PERSONAS_NOVEDADES.md
          if test -f scripts/patches/059.patch.b64.1; then git rm scripts/patches/059.patch.b64.{1,2,3}; fi
          if test -f scripts/patches/059.qa.patch; then git rm scripts/patches/059.qa.patch; fi
          if ! git diff --cached --quiet; then
            git commit -m 'feat(059): select active people directly in payroll novelty forms'
            git push origin HEAD:feat/novelty-directory-059
          fi
          git rev-parse HEAD > verification/validated-commit.txt
      - name: Archive evidence and source
        if: always()
        shell: bash
        run: |
          git diff HEAD > verification/pending-changes.patch
          git archive --format=tar.gz -o verification/directory-059-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelty-directory-059-acceptance
          path: verification/
          retention-days: 5
  production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify canonical published bytes and real anonymous rejection
        run: node scripts/verify-novelty-directory-production-059.mjs
      - name: Exercise published UI with synthetic API responses only
        env:
          NOVELTY_DIRECTORY_LIVE_ASSETS: '1'
        run: node scripts/verify-novelty-directory-059.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelty-directory-059-production-verification
          path: verification/
          retention-days: 5
