name: Store already validated application blobs
on:
  push:
    branches: ['internal/local-qa-20260916']
    paths: ['.qa/store-reviewed-blobs.mjs', '.github/workflows/internal-local-qa-preparation.yml']
permissions:
  contents: write
jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          path: meta
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '2f97b8394841dbea8e8c17099fc8b3d177bd9673'
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify patch and resulting file hashes
        run: node ../meta/.qa/candidate.mjs apply
      - name: Store application blobs only, no workflow changes or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../meta/.qa/store-reviewed-blobs.mjs
