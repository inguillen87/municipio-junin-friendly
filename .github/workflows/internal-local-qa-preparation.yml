name: One-time local QA preparation
on:
  push:
    branches: ['internal/local-qa-20260916']
    paths: ['.github/workflows/internal-local-qa-preparation.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '2f97b8394841dbea8e8c17099fc8b3d177bd9673'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package exact public source and locked dependencies for offline tests
        run: |
          git rev-parse HEAD > SOURCE_COMMIT.txt
          tar --exclude='./.git' --exclude='./public' --exclude='./verification' -czf "$RUNNER_TEMP/municontrol-local-qa.tar.gz" .
          sha256sum "$RUNNER_TEMP/municontrol-local-qa.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: municontrol-local-qa-2f97b83
          path: ${{ runner.temp }}/municontrol-local-qa.tar.gz
          retention-days: 1
          compression-level: 0
