name: Noelia complete own payroll circuit
on:
  push:
    branches: ['master', 'codex/final-september-source-20261006']
    paths: ['assets/**', 'api/**', 'lib/**', 'scripts/**', 'tests/**', 'contracts/**', 'package.json', 'package-lock.json', '.nvmrc', '.github/workflows/**']
  pull_request:
    branches: ['master']
    paths: ['assets/**', 'api/**', 'lib/**', 'scripts/**', 'tests/**', 'contracts/**', 'package.json', 'package-lock.json', '.nvmrc', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  circuit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        major: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.major }}
        env:
          POSTGRES_DB: own_payroll_run_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
        ports:
          - 554${{ matrix.major }}:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: noelia-circuit-synthetic-qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and run all existing regressions
        run: npm run build
      - name: Prepare the disposable synthetic database
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.major }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOSUPERUSER NOBYPASSRLS;'
      - run: npx --no-install playwright install --with-deps chromium
      - name: Complete adoption declarations, mixed jurisdictions and immutable recovery
        run: node scripts/verify-employment-adoption-preparation-browser.mjs --output-prefix=verification/adoption-jurisdictions-ci
      - name: Upgrade the published SQL130 baseline and preserve existing synthetic history
        run: node scripts/verify-published-novelty-adoption.mjs --transport=ci --major=${{ matrix.major }} --source-commit=${{ github.sha }} --output=verification/published-adoption-ci
      - name: Complete actual HTTP, SQL and browser circuit, jurisdiction and annual positions
        run: node scripts/verify-noelia-payroll-circuit.mjs --transport=ci --major=${{ matrix.major }} --source-commit=${{ github.sha }} --browser=chromium --jurisdictions=true --positions=true --output=verification/noelia-circuit-ci
      - name: Preserve inactive history with unknown jurisdiction and refuse active unknowns
        run: node scripts/verify-adoption-inactive-jurisdiction.mjs --transport=ci --major=${{ matrix.major }} --source-commit=${{ github.sha }} --output=verification/inactive-jurisdiction-ci
      - name: Complete final-cut source, proposal and exact immutable application
        run: node scripts/verify-final-contract-adoption.mjs --transport=ci --major=${{ matrix.major }} --source-commit=${{ github.sha }} --output=verification/final-adoption-ci
      - name: Review, compare, download and recover the complete final-cut proposal
        run: node scripts/verify-final-contract-adoption-browser.mjs --output-prefix=verification/final-adoption-browser-ci
      - name: Adopt every active contract at full operational volume while preserving inactive history
        run: node scripts/verify-active-contract-adoption.mjs --scale=true --transport=ci --major=${{ matrix.major }} --source-commit=${{ github.sha }} --output=verification/active-adoption-ci
      - name: Recover and replay earlier complete adoption requests after the active schema upgrade
        run: node scripts/verify-active-contract-adoption.mjs --transport=ci --major=${{ matrix.major }} --source-commit=${{ github.sha }} --output=verification/active-adoption-legacy-ci
      - name: Review all 869 active rows, download observations and recover the same voluntary attempt
        run: node scripts/verify-final-contract-adoption-browser.mjs --output-prefix=verification/active-adoption-browser-ci --active=true
      - name: Independently decide and consult the final-cut result through actual SQL and HTTP
        run: node scripts/verify-municipal-adoption-operator-browser.mjs --transport=ci --final-cut=true --major=${{ matrix.major }} --source-commit=${{ github.sha }} --output=verification/final-adoption-operator-ci
      - name: Preserve synthetic evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noelia-circuit-pg${{ matrix.major }}-${{ github.sha }}
          path: |
            verification/noelia-circuit-ci/result.json
            verification/noelia-circuit-ci/*-proof.json
            verification/noelia-circuit-ci/*-browser.json
            verification/noelia-circuit-ci/browser-transport.json
            verification/noelia-circuit-ci/*.png
            verification/published-adoption-ci/result.json
            verification/published-adoption-ci/installation-proof.json
            verification/published-adoption-ci/uuid-repair-proof.json
            verification/adoption-jurisdictions-ci-*.json
            verification/adoption-jurisdictions-ci-*.png
            verification/published-adoption-ci/uuid-three-defaults-proof.json
            verification/inactive-jurisdiction-ci/result.json
            verification/inactive-jurisdiction-ci/failure.txt
            verification/final-adoption-ci/result.json
            verification/final-adoption-ci/failure.txt
            verification/final-adoption-browser-ci-*.json
            verification/final-adoption-browser-ci-*.png
            verification/final-adoption-operator-ci/result.json
            verification/final-adoption-operator-ci/failure.json
            verification/final-adoption-operator-ci/*.png
            verification/active-adoption-ci/result.json
            verification/active-adoption-ci/failure.txt
            verification/active-adoption-legacy-ci/result.json
            verification/active-adoption-legacy-ci/failure.txt
            verification/active-adoption-browser-ci-*.json
            verification/active-adoption-browser-ci-*.png
          retention-days: 7
