name: Payroll detail closure acceptance
on:
  push:
    branches: ['feat/payroll-detail-048-close']
permissions:
  contents: read
concurrency:
  group: payroll-detail-close
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: mkdir -p verification
      - name: Integrate existing audited source and check idempotence
        run: |
          node scripts/integrate-payroll-detail.mjs
          node scripts/refine-payroll-detail.mjs
          git diff | sha256sum > /tmp/before
          node scripts/integrate-payroll-detail.mjs
          node scripts/refine-payroll-detail.mjs
          git diff | sha256sum > /tmp/after
          diff /tmp/before /tmp/after
      - run: npm ci
      - name: Repository tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/all-tests.log
      - name: Build application
        run: |
          set -o pipefail
          node scripts/build-friendly.mjs 2>&1 | tee verification/build.log
      - run: npx playwright install --with-deps chromium
      - name: Payroll browser acceptance with synthetic records
        run: |
          set -o pipefail
          node scripts/verify-payroll-detail-browser.mjs 2>&1 | tee verification/payroll-browser.log
      - name: Active roster regression with synthetic records
        run: |
          set -o pipefail
          node scripts/verify-workforce-operations-browser.mjs 2>&1 | tee verification/workforce-browser.log
      - name: Commit only validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/internal-data.js internal-dashboard.html lib/internal-resource-access.js scripts/build-friendly.mjs vercel.json assets/payroll-detail-export.js assets/payroll-detail-panel.js
          if ! git diff --cached --quiet; then
            git commit -m 'feat(payroll): integrate private delivery and detail without regressing active roster'
            git push origin HEAD:feat/payroll-detail-048-close
          fi
          git rev-parse HEAD > verification/validated-commit.txt
      - name: Archive source and reports, no municipal files
        if: always()
        run: git archive --format=tar.gz -o verification/payroll-detail-close-source.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: payroll-detail-close-acceptance
          path: verification/
          retention-days: 5
