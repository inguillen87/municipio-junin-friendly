name: Native novelty sheet 057
on:
  push:
    branches: ['feat/planilla-novedades-057', 'master']
    paths:
      - '.github/workflows/novelty-sheet-057.yml'
      - 'scripts/patches/057*'
      - 'assets/payroll-novelty-sheet*'
      - 'assets/payroll-novelty-workbench.js'
      - 'assets/payroll-novelty-review-panel.js'
      - 'novedades-nomina.html'
      - 'scripts/verify-novelty-sheet*'
      - 'tests/payroll-novelty-sheet-057.test.js'
      - 'tests/payroll-novelty-ux.test.js'
permissions:
  contents: read
concurrency:
  group: novelty-sheet-057-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p verification
      - name: Apply exact reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          if test -f scripts/patches/057.patch.b64.1; then
            cat scripts/patches/057.patch.b64.{1,2} | base64 --decode > /tmp/057.patch.gz
            echo 'da91076be47904da450a1b2fe84b791c974be10f3f24965236e31dd176eef72c  /tmp/057.patch.gz' | sha256sum --check -
            gzip -dc /tmp/057.patch.gz > /tmp/057.patch
            git apply --check /tmp/057.patch
            git apply /tmp/057.patch
          fi
          if test -f scripts/patches/057.fix.patch; then
            git apply --check scripts/patches/057.fix.patch
            git apply scripts/patches/057.fix.patch
          fi
          git diff --check
      - run: npm ci
      - name: Full tests and static build
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee verification/all-tests.log
          node scripts/build-friendly.mjs 2>&1 | tee verification/build.log
      - run: npx playwright install --with-deps chromium
      - name: Native planilla full browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-novelty-sheet-057.mjs 2>&1 | tee verification/native-sheet-browser.log
      - name: Existing modes, comparisons, PDF, library and reports regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-novelty-review-056.mjs 2>&1 | tee verification/novelty-review-browser.log
          node scripts/verify-payroll-comparison-056.mjs 2>&1 | tee verification/comparison-browser.log
          node scripts/verify-payroll-summary-055.mjs 2>&1 | tee verification/summary-browser.log
          node scripts/verify-report-summary-shell.mjs 2>&1 | tee verification/summary-shell.log
          node scripts/verify-document-library-legajo.mjs 2>&1 | tee verification/library-browser.log
          node scripts/verify-report-centre-browser.mjs 2>&1 | tee verification/reports-browser.log
          node scripts/verify-export-roster-browser.mjs 2>&1 | tee verification/roster-browser.log
      - name: Commit validated implementation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/payroll-novelty-sheet.js assets/payroll-novelty-sheet-model.js assets/payroll-novelty-sheet.css assets/payroll-novelty-workbench.js assets/payroll-novelty-review-panel.js novedades-nomina.html scripts/build-friendly.mjs scripts/verify-novelty-sheet-057.mjs scripts/verify-novelty-sheet-production-057.mjs tests/payroll-novelty-sheet-057.test.js tests/payroll-novelty-ux.test.js docs/SPRINT_057_PLANILLA_NOVEDADES.md
          if test -f scripts/patches/057.patch.b64.1; then git rm scripts/patches/057.patch.b64.{1,2}; fi
          if test -f scripts/patches/057.fix.patch; then git rm scripts/patches/057.fix.patch; fi
          if ! git diff --cached --quiet; then
            git commit -m 'feat(057): editable multi-legajo novelty sheet without file uploads'
            git push origin HEAD:feat/planilla-novedades-057
          fi
          git rev-parse HEAD > verification/validated-commit.txt
      - name: Preserve review evidence
        if: always()
        run: |
          git diff HEAD > verification/pending-changes.patch
          git archive --format=tar.gz -o verification/native-sheet-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelty-sheet-057-acceptance
          path: verification/
          retention-days: 5
  production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare canonical production resources and unauthenticated rejection
        run: node scripts/verify-novelty-sheet-production-057.mjs
      - name: Verify published UI with synthetic API only
        env:
          SHEET_LIVE_ASSETS: '1'
        run: node scripts/verify-novelty-sheet-057.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelty-sheet-057-production-verification
          path: verification/
          retention-days: 5
