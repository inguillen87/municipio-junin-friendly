name: Preauthorized payroll source delivery
on:
  push:
    branches: ['ops/payroll-private-delivery-20260911']
    paths: ['ops/payroll-delivery-jobs.json']
permissions:
  contents: read
concurrency:
  group: payroll-private-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Execute registered jobs without retrieving source bytes
        run: node scripts/trigger-payroll-private-delivery.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: private-delivery-receipts
          path: verification/private-delivery-receipts.json
          retention-days: 3
