name: GRH multi-run candidate extraction
on:
  workflow_dispatch:
  push:
    branches: ['master', 'work/grh-multirun-candidate-20260923']
    paths:
      - 'scripts/extract_grh_core.py'
      - 'scripts/lib/grh-source-profile*'
      - 'scripts/verify-grh-multirun-candidate.mjs'
      - 'scripts/import-rrhh-neon.mjs'
      - 'scripts/lib/grh-successor-package*.mjs'
      - 'scripts/verify-grh-successor-package.mjs'
      - 'tests/grh-successor-package*.test.js'
      - 'tests/grh-multirun-candidate.test.js'
      - 'tests/test_extract_grh_multirun.py'
      - '.github/workflows/grh-multirun-candidate.yml'
permissions:
  contents: read
concurrency:
  group: grh-multirun-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict synthetic extraction and compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/grh-multirun
          python3 -m unittest discover -s tests -p test_extract_grh_multirun.py -v 2>&1 | tee verification/grh-multirun/extraction.log
          python3 -m unittest discover -s tests -p test_grh_source_profiles.py -v 2>&1 | tee verification/grh-multirun/profiles.log
          python3 -m unittest discover -s tests -p test_grh_snapshot_shape.py -v 2>&1 | tee verification/grh-multirun/shape.log
      - name: Complete tests and build, no database credentials
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee verification/grh-multirun/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grh-multirun-candidate
          path: verification/grh-multirun/
          retention-days: 5
