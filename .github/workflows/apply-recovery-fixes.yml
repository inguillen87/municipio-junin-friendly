name: Apply reviewed recovery patch
on:
  push:
    branches: ['work/municontrol-recovery-20260923']
    paths: ['scripts/apply-recovery-fixes-20260923.mjs', '.github/workflows/apply-recovery-fixes.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/apply-recovery-fixes-20260923.mjs
      - run: node --test tests/admin-status-tone.test.js tests/clock-installer-task-policy.test.js
      - name: Commit only the exact reviewed files to the work branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'inguillen87'
          git config user.email 'guillen.marce@gmail.com'
          git add -- administracion-plataforma.html local-agents/clock-fleet/windows-installer/InstallerCore.cs
          git commit -m 'fix: resolve LocalService SID and distinguish inactive admin states'
          gh auth setup-git
          git push origin HEAD:refs/heads/work/municontrol-recovery-20260923
          git rev-parse HEAD
