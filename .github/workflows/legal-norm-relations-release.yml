name: Legal norm relations release
on:
  push:
    branches: ['codex/legal-norm-relations-20260921','master']
    paths:
      - 'api/internal-legal-norm-relations.js'
      - 'assets/legal-norm-relations*'
      - 'internal-legal-norm-relations.html'
      - 'src/islands/legal-registry-entry.tsx'
      - 'scripts/migrations/090-legal-norm-relations.sql'
      - 'scripts/verify-legal-norm-relations-browser.mjs'
      - 'tests/legal-norm-relations.test.js'
      - 'scripts/build-legal-registry.mjs'
      - '.github/workflows/legal-norm-relations-release.yml'
permissions:
  contents: read
concurrency:
  group: legal-norm-relations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-legal-norm-relations-browser.mjs
