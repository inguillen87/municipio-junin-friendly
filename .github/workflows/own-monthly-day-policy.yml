name: Own monthly day policy
# Synthetic SQL/HTTP integration. This workflow does not certify browser or municipal acceptance.
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'api/**'
      - 'lib/**'
      - 'contracts/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.vercelignore'
      - '.github/workflows/own-monthly-day-policy.yml'
  push:
    branches: ['master']
    paths:
      - 'assets/**'
      - 'api/**'
      - 'lib/**'
      - 'contracts/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.vercelignore'
      - '.github/workflows/own-monthly-day-policy.yml'
permissions:
  contents: read
concurrency:
  group: own-monthly-day-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Own monthly day policy / PG${{ matrix.pg }} / ${{ matrix.baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
        baseline: [pre107, published107]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          # Only the disposable canonical synthetic service uses this fixture password.
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-start-interval 1s --health-start-period 30s --health-interval 1h --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate the monthly-day model, protocol and transport before SQL
        run: node --test tests/own-monthly-day-policy.test.js tests/own-monthly-day-policy-installation.test.js tests/own-monthly-day-policy-commands.test.js tests/own-monthly-day-policy-qa.test.js tests/own-monthly-day-policy-runner.test.js tests/own-monthly-day-policy-workflow.test.js tests/own-payroll-programme-source-preparation.test.js tests/own-payroll-program.test.js tests/own-payroll-approved-input.test.js
      - name: Prepare only the disposable synthetic service
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - name: Prepare the synthetic evidence parent directory
        run: mkdir -p verification
      - name: Compile and verify installation, ordinary approval, capture and recovery in the same synthetic source
        run: node scripts/verify-own-monthly-day-policy.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --operational-pair-baseline=${{ matrix.baseline }} --output=verification/monthly-day-policy-pg${{ matrix.pg }}-${{ matrix.baseline }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: own-monthly-day-policy-pg${{ matrix.pg }}-${{ matrix.baseline }}-${{ github.sha }}
          path: |
            verification/monthly-day-policy-pg${{ matrix.pg }}-${{ matrix.baseline }}/*.json
            verification/monthly-day-policy-pg${{ matrix.pg }}-${{ matrix.baseline }}/*failure.txt
            verification/monthly-day-policy-pg${{ matrix.pg }}-${{ matrix.baseline }}/*.log
          if-no-files-found: error
          retention-days: 5
