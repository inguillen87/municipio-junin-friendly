name: Own ART closed payroll
on:
  pull_request:
    paths: ['lib/own-period-read-recovery.js', 'tests/own-period-read-recovery.test.js', 'scripts/lib/own-period-read-contention-qa.mjs', '.vercelignore', 'api/internal-own-art*', 'assets/own-art*', 'assets/own-payroll*.js', 'assets/payroll-navigation.js', 'lib/internal-own-art-days.js', 'lib/own-art-response.js', 'scripts/build-friendly.mjs', 'scripts/verify-own-art.mjs', 'scripts/verify-payroll-formula-lab-browser.mjs', 'scripts/verify-payroll-transport-observation.mjs', 'scripts/verify-source-preview-transport-matrix.mjs', 'scripts/verify-source-preview-fragmented-transport.mjs', 'scripts/install-patched-chromium-diagnostic.mjs', 'docs/QA_CHROMIUM_VERIFIED_20261011.md', 'tests/project-chromium-workflow.test.js', 'scripts/lib/qa-lock-observation.mjs', 'tests/qa-lock-observation.test.js', 'scripts/lib/project-chromium.mjs', 'scripts/install-project-chromium.mjs', 'scripts/lib/diagnostic-patched-chromium.mjs', 'scripts/lib/patched-chromium-diagnostic-manifest.mjs', 'scripts/lib/payroll-transport-observation.mjs', 'tests/payroll-transport-observation.test.js', 'scripts/verify-own-period-participation.mjs', 'scripts/verify-own-salary-seniority.mjs', 'scripts/verify-salary-auxiliary-namespace.mjs', 'scripts/lib/own-art*', 'scripts/lib/own-period-participation*', 'scripts/lib/own-salary-seniority*', 'scripts/lib/adopted-consumers-installation-pins.mjs', 'scripts/migrations/158-own-art-days.sql', 'scripts/migrations/159-own-art-report.sql', 'tests/own-art*', 'tests/fixtures/own-art*', '.github/workflows/own-art.yml']
  push:
    branches: ['master']
    paths: ['lib/own-period-read-recovery.js', 'tests/own-period-read-recovery.test.js', 'scripts/lib/own-period-read-contention-qa.mjs', '.vercelignore', 'api/internal-own-art*', 'assets/own-art*', 'assets/own-payroll*.js', 'assets/payroll-navigation.js', 'lib/internal-own-art-days.js', 'lib/own-art-response.js', 'scripts/build-friendly.mjs', 'scripts/verify-own-art.mjs', 'scripts/verify-payroll-formula-lab-browser.mjs', 'scripts/verify-payroll-transport-observation.mjs', 'scripts/verify-source-preview-transport-matrix.mjs', 'scripts/verify-source-preview-fragmented-transport.mjs', 'scripts/install-patched-chromium-diagnostic.mjs', 'docs/QA_CHROMIUM_VERIFIED_20261011.md', 'tests/project-chromium-workflow.test.js', 'scripts/lib/qa-lock-observation.mjs', 'tests/qa-lock-observation.test.js', 'scripts/lib/project-chromium.mjs', 'scripts/install-project-chromium.mjs', 'scripts/lib/diagnostic-patched-chromium.mjs', 'scripts/lib/patched-chromium-diagnostic-manifest.mjs', 'scripts/lib/payroll-transport-observation.mjs', 'tests/payroll-transport-observation.test.js', 'scripts/verify-own-period-participation.mjs', 'scripts/verify-own-salary-seniority.mjs', 'scripts/verify-salary-auxiliary-namespace.mjs', 'scripts/lib/own-art*', 'scripts/lib/own-period-participation*', 'scripts/lib/own-salary-seniority*', 'scripts/lib/adopted-consumers-installation-pins.mjs', 'scripts/migrations/158-own-art-days.sql', 'scripts/migrations/159-own-art-report.sql', 'tests/own-art*', 'tests/fixtures/own-art*', '.github/workflows/own-art.yml']
permissions:
  contents: read
concurrency:
  group: own-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Complete and rejected native delivery regression
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-source-preview-fragmented-transport.mjs
      - name: Existing ART migration and formula workbench regression
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-payroll-formula-lab-browser.mjs
      - name: Prepare disposable PostgreSQL with the original runtime restrictions
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - name: Observe maintenance in the disposable PostgreSQL service
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: |
          psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'ALTER SYSTEM SET log_autovacuum_min_duration=0'
          psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'SELECT pg_reload_conf()'
      - name: Own hire, exact calculation, independent close, documented days and full mobile ART
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
          MC_QA_LOCK_OBSERVATION: '1'
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: node scripts/verify-own-art.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --browser=chromium --output=verification/own-art-pg${{ matrix.pg }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-art-pg${{ matrix.pg }}-${{ github.run_id }}
          path: verification/own-art-pg${{ matrix.pg }}
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-transport-pg${{ matrix.pg }}-${{ github.run_id }}
          path: |
            verification/payroll-formula-transport
            verification/release-chromium-157.0.8098.0/installation.json
          retention-days: 5
  transport-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Finite synthetic observation, retaining every original failure
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-payroll-transport-observation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-transport-finite-${{ github.run_id }}
          path: |
            verification/payroll-formula-transport
            verification/release-chromium-157.0.8098.0/installation.json
          retention-days: 5
  transport-reduction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Reduced synthetic reader, object lifetime and HTTP framing matrix
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-source-preview-transport-matrix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-transport-reduced-${{ github.run_id }}
          path: |
            verification/payroll-formula-transport/reduced-matrix
            verification/release-chromium-157.0.8098.0/installation.json
          retention-days: 5
  patched-transport-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify the exact official patched binary in the disposable checkout
        run: node scripts/install-patched-chromium-diagnostic.mjs
      - name: Original reader, unchanged original flows and negative delivery controls
        env:
          NODE_OPTIONS: --import ./scripts/lib/diagnostic-patched-chromium.mjs
        run: |
          node scripts/verify-source-preview-fragmented-transport.mjs
          node scripts/verify-source-preview-transport-matrix.mjs
          node scripts/verify-payroll-transport-observation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-transport-patched-${{ github.run_id }}
          path: |
            verification/payroll-formula-transport
            verification/patched-chromium-157.0.8098.0/installation.json
          retention-days: 5
