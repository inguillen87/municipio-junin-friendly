name: Native import review independence
on:
  pull_request:
    paths:
      - 'lib/native-entity-import-preview.js'
      - 'lib/native-payroll-import-review.js'
      - 'tests/native-*import*.test.js'
      - 'tests/fixtures/native-import-registry.js'
      - 'scripts/verify-native-import-independence.mjs'
      - '.github/workflows/native-import-independence.yml'
  push:
    branches: [master]
    paths:
      - 'lib/native-entity-import-preview.js'
      - 'lib/native-payroll-import-review.js'
      - 'tests/native-*import*.test.js'
      - 'tests/fixtures/native-import-registry.js'
      - 'scripts/verify-native-import-independence.mjs'
      - '.github/workflows/native-import-independence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-import-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node --test tests/native-payroll-import-review.test.js tests/native-entity-import-preview.test.js
      - run: node scripts/verify-native-import-independence.mjs
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
