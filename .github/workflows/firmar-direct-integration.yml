name: FirmAR direct integration - synthetic only
on:
  push:
    branches: ['internal-firmar-direct-20260917']
    paths:
      - 'lib/firmar-*.js'
      - 'api/internal-firmar.js'
      - 'api/firmar-callback.js'
      - 'assets/firmar-journey*'
      - 'assets/firmar-return*'
      - 'assets/firmar-http-client.js'
      - 'assets/firmar-connected-journey.css'
      - 'src/islands/firmar-journey-panel.tsx'
      - 'src/islands/firmar-return-panel.tsx'
      - 'src/islands/firmar-connected-journey.tsx'
      - 'tests/firmar-*.test.js'
      - 'scripts/verify-firmar-*.mjs'
      - 'scripts/fixtures/firmar-journal-*.sql'
      - 'scripts/migrations/071-firmar-attempt-journal.sql'
      - '.github/workflows/firmar-direct-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmar-direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: municontrol_firmar_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: PostgreSQL reservation, return, receipt and access boundaries
        env:
          FIRMAR_SYNTHETIC_POSTGRES: 'true'
        run: node scripts/verify-firmar-persistence.mjs
      - name: Full application regression and existing build
        run: npm run build
      - name: Synthetic interaction browser
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-firmar-journey-browser.mjs
          node scripts/verify-firmar-continuity-browser.mjs
          node scripts/verify-firmar-return-lifecycle-browser.mjs
      - name: Connected HTTP and PostgreSQL signing journey
        env:
          FIRMAR_SYNTHETIC_POSTGRES: 'true'
        run: node scripts/verify-firmar-http-browser.mjs --postgres
      - name: Evidence with no real identity or document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmar-synthetic-journey
          path: |
            verification/firmar-journey/
            verification/firmar-continuity/
            verification/firmar-return-lifecycle/
            verification/firmar-persistence/
            verification/firmar-http/
          retention-days: 5
