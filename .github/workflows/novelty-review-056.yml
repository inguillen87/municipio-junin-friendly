name: Novedades review 056
on:
  push:
    branches: ['feat/novelty-review-056', 'master']
    paths:
      - '.github/workflows/novelty-review-056.yml'
      - 'scripts/patches/056*'
      - 'assets/payroll-novelty*'
      - 'novedades-nomina.html'
      - 'scripts/verify-novelty*'
      - 'tests/payroll-novelty-review-056.test.js'
permissions:
  contents: read
concurrency:
  group: novelty-review-056-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p verification
      - name: Apply exact reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          if test -f scripts/patches/056.patch.b64.1; then
            node --input-type=module -e 'import fs from "node:fs"; const parts=[1,2,3,4].map(n=>fs.readFileSync("scripts/patches/056.patch.b64."+n,"utf8")); const encoded=parts.join("").replace(/\s/g,""); if(!/^[A-Za-z0-9+/]*={0,2}$/.test(encoded)||encoded.length%4!==0)throw Error("INVALID_PATCH_ENCODING"); fs.writeFileSync("/tmp/056.patch.gz",Buffer.from(encoded,"base64"));'
            echo '05e6ffae85f8c7c877e28900dd611c12677ecc6f643759eb9907388a5aacde2b  /tmp/056.patch.gz' | sha256sum --check -
            gzip -dc /tmp/056.patch.gz > /tmp/056.patch
            git apply --check /tmp/056.patch
            git apply /tmp/056.patch
          fi
          if test -f scripts/patches/056.qa.patch; then
            git apply --check scripts/patches/056.qa.patch
            git apply scripts/patches/056.qa.patch
          fi
      - run: npm ci
      - name: Full unit tests and build
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee verification/all-tests.log
          node scripts/build-friendly.mjs 2>&1 | tee verification/build.log
      - run: npx playwright install --with-deps chromium
      - name: Complete novelty review with isolated API responses
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-novelty-review-056.mjs 2>&1 | tee verification/novelty-browser.log
      - name: Legajo, report centre and F-M export regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-payroll-summary-055.mjs 2>&1 | tee verification/summary-browser.log
          node scripts/verify-report-centre-browser.mjs 2>&1 | tee verification/report-centre.log
          node scripts/verify-export-roster-browser.mjs 2>&1 | tee verification/roster.log
      - name: Commit only validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/payroll-novelty-review.js assets/payroll-novelty-review-panel.js assets/payroll-novelty-review.css assets/payroll-novelty-workbench.js novedades-nomina.html scripts/build-friendly.mjs sw.js tests/payroll-novelty-review-056.test.js scripts/verify-novelty-review-056.mjs scripts/verify-novelty-production-056.mjs docs/SPRINT_056_REVISION_NOVEDADES.md
          if test -f scripts/patches/056.patch.b64.1; then git rm scripts/patches/056.patch.b64.{1,2,3,4}; fi
          if test -f scripts/patches/056.qa.patch; then git rm scripts/patches/056.qa.patch; fi
          if ! git diff --cached --quiet; then
            git commit -m 'feat(056): review all novelty rows and detect invalid loads before creating batches'
            git push origin HEAD:feat/novelty-review-056
          fi
          git rev-parse HEAD > verification/validated-commit.txt
      - name: Archive evidence and source
        if: always()
        shell: bash
        run: |
          git diff > verification/pending-changes.patch
          git archive --format=tar.gz -o verification/novelty-056-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelty-056-acceptance
          path: verification/
          retention-days: 5
  production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Match published source bytes and verify anonymous rejection
        run: node scripts/verify-novelty-production-056.mjs
      - name: Exercise published UI with synthetic API only
        env:
          NOVELTY_LIVE_ASSETS: '1'
        run: node scripts/verify-novelty-review-056.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelty-056-production-verification
          path: verification/
          retention-days: 5
