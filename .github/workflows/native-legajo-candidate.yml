name: Native legajo candidate - no previews
on:
  push:
    branches: ['internal/native-legajo-067-20260916']
permissions:
  contents: write
concurrency:
  group: native-legajo-candidate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          path: meta
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '7a13f1608b5408fbf24ff7e963ceb9c98a00534a'
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply reviewed scoped changes
        run: node ../meta/.qa/integrate-native.mjs apply
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build before focused browser diagnosis
        run: node scripts/build-friendly.mjs
      - run: npx playwright install --with-deps chromium
      - name: Native creation browser diagnosis
        run: node ../meta/.qa/probe-native.mjs
      - name: Complete suite and workforce regression
        run: |
          npm test
          node scripts/verify-workforce-operations-browser.mjs
      - name: Prepare validated commit without updating master
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../meta/.qa/integrate-native.mjs candidate
      - name: Synthetic browser evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-legajo-browser-${{ github.run_id }}
          path: |
            app/verification/native-employee-*.json
            app/verification/native-employee-*.png
          retention-days: 3
