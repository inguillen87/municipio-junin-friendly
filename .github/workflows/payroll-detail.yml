name: Payroll detail acceptance
on:
  push:
    branches: ['feat/payroll-detail-048-20260910']
permissions:
  contents: read
concurrency:
  group: payroll-detail-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p verification
      - name: Integrate tracked source
        run: |
          node scripts/integrate-payroll-detail.mjs
          git diff | sha256sum > /tmp/before.txt
          node scripts/integrate-payroll-detail.mjs
          git diff | sha256sum > /tmp/after.txt
          diff /tmp/before.txt /tmp/after.txt
      - run: npm ci
      - name: Repository tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/all-tests.log
      - name: Build application
        run: |
          set -o pipefail
          node scripts/build-friendly.mjs 2>&1 | tee verification/build.log
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance, synthetic records only
        run: |
          set -o pipefail
          node scripts/verify-payroll-detail-browser.mjs 2>&1 | tee verification/browser.log
      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/internal-data.js internal-dashboard.html lib/internal-resource-access.js scripts/build-friendly.mjs vercel.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat(payroll): integrate validated concept detail, deductions and exports'
            git push origin HEAD:feat/payroll-detail-048-20260910
          fi
          git rev-parse HEAD > verification/validated-commit.txt
      - name: Archive source only
        if: always()
        run: git archive --format=tar.gz -o verification/payroll-detail-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payroll-detail-acceptance
          path: verification/
          retention-days: 3
