name: Monthly revision storage capacity
on:
  pull_request:
    paths: ['scripts/migrations/170-*', 'scripts/lib/monthly-revision-storage*', 'scripts/verify-monthly-revision-storage-*', 'scripts/prepare-monthly-revision-storage-installation.mjs', 'tests/monthly-revision-storage*', 'docs/NOVEDADES_MENSUALES_CAPACIDAD.md', '.vercelignore', '.github/workflows/monthly-revision-storage-capacity.yml']
  push:
    branches: ['master']
    paths: ['scripts/migrations/170-*', 'scripts/lib/monthly-revision-storage*', 'scripts/verify-monthly-revision-storage-*', 'scripts/prepare-monthly-revision-storage-installation.mjs', 'tests/monthly-revision-storage*', 'docs/NOVEDADES_MENSUALES_CAPACIDAD.md', '.vercelignore', '.github/workflows/monthly-revision-storage-capacity.yml']
permissions:
  contents: read
concurrency:
  group: monthly-revision-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:vercel
      - name: Prepare only the disposable synthetic database
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - name: Generate all prior cases and actual storage boundary regressions
        run: node scripts/verify-monthly-revision-storage-sql.mjs --expected-major=${{ matrix.pg }} --write-sql=verification/monthly-storage-pg${{ matrix.pg }}.sql
      - name: Verify whole rollback suite without cloud destinations
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -q -t -A -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -f verification/monthly-storage-pg${{ matrix.pg }}.sql > verification/monthly-storage-pg${{ matrix.pg }}.log
      - name: Verify committed installation, durable conservation and verify-only repeat
        run: node scripts/verify-monthly-revision-storage-durable.mjs --major=${{ matrix.pg }} --source-commit=${{ github.sha }} --transport=ci --output=verification/monthly-storage-durable-pg${{ matrix.pg }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: monthly-revision-storage-pg${{ matrix.pg }}-${{ github.sha }}
          path: |
            verification/monthly-storage-pg${{ matrix.pg }}.log
            verification/monthly-storage-durable-pg${{ matrix.pg }}.json
            verification/monthly-storage-durable-pg${{ matrix.pg }}.json.failure.txt
          retention-days: 5
