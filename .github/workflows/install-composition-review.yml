name: Reviewed install composition (no database)
on:
  pull_request:
    paths:
      - 'scripts/lib/install-composition-source.mjs'
      - 'scripts/lib/install-composition-attestation.mjs'
      - 'scripts/build-install-composition.mjs'
      - 'scripts/install-composition-attestation.mjs'
      - 'scripts/candidates/*-v1.derived.*'
      - 'scripts/candidates/*-v1.source.*'
      - 'scripts/candidates/install-composition-attestation-v1.json'
      - 'tests/install-composition.test.js'
      - 'tests/install-composition-attestation.test.js'
      - '.github/workflows/install-composition-review.yml'
permissions:
  contents: read
jobs:
  offline-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/build-install-composition.mjs --check
      - run: node --test tests/install-composition.test.js tests/install-composition-attestation.test.js
