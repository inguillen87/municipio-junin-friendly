name: Municipal owner program
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'api/**'
      - 'lib/**'
      - 'contracts/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.vercelignore'
      - '.github/workflows/municipal-owner-program.yml'
  push:
    branches: ['master']
    paths:
      - 'assets/**'
      - 'api/**'
      - 'lib/**'
      - 'contracts/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.vercelignore'
      - '.github/workflows/municipal-owner-program.yml'
permissions:
  contents: read
concurrency:
  group: municipal-owner-program-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Municipal owner program / PG${{ matrix.pg }} / ${{ matrix.baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
        baseline: [pre107, published107]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: noelia-circuit-synthetic-qa
          POSTGRES_DB: own_payroll_run_qa
        ports: ['554${{ matrix.pg }}:5432']
        # Startup readiness stays enabled; periodic probes are outside this
        # guarded job's deadline and cannot introduce unrelated SQL clients.
        options: >-
          --health-cmd "pg_isready -U postgres -d own_payroll_run_qa" --health-start-interval 1s --health-start-period 30s --health-interval 1h --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pure census contracts only; no SQL builder or native runner in this step
        run: node --test tests/own-payroll-report-census-qa-rpc.test.js tests/own-payroll-report-census-190-iam-fixture.test.js tests/own-payroll-report-census-190-legacy.test.js tests/own-payroll-report-census-workflow.test.js tests/own-payroll-report-census-program-synthetic.test.js
      - name: Owned QA cleanup with synthetic transcripts
        run: node --test tests/owner190-cleanup-profile.test.js tests/owner190-cleanup-raw255.local.test.js
      - run: npm run build:vercel
      - name: Prepare only the disposable synthetic service
        env:
          PGPASSWORD: noelia-circuit-synthetic-qa
        run: psql -X -h 127.0.0.1 -p 554${{ matrix.pg }} -U postgres -d own_payroll_run_qa -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgcrypto; CREATE ROLE municontrol_actions_runtime_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
      - run: npx --no-install playwright install-deps chromium
      - name: Install the admitted project Chromium before browser use
        run: |
          mkdir -p verification
          node scripts/install-project-chromium.mjs --purpose=release-verification
      - name: Complete canonical 190 authority, ordinary and owner decisions, SQL protocol and existing programme panel
        if: matrix.baseline == 'pre107'
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-municipal-owner-program.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --operational-pair-baseline=${{ matrix.baseline }} --output=verification/owner-program-pg${{ matrix.pg }}-${{ matrix.baseline }}
      - name: Complete canonical 190 plus closed-report census200 in the SAME fixture
        if: matrix.baseline == 'published107'
        env:
          NODE_OPTIONS: --import ./scripts/lib/project-chromium.mjs
        run: node scripts/verify-own-payroll-report-census.mjs --major=${{ matrix.pg }} --transport=ci --source-commit=${{ github.sha }} --operational-pair-baseline=published107 --output=verification/owner-program-pg${{ matrix.pg }}-${{ matrix.baseline }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.baseline == 'pre107'
        with:
          name: municipal-owner-program-pg${{ matrix.pg }}-${{ matrix.baseline }}-${{ github.sha }}
          path: |
            verification/owner-program-pg${{ matrix.pg }}-${{ matrix.baseline }}/*.json
            verification/owner-program-pg${{ matrix.pg }}-${{ matrix.baseline }}/*failure.txt
            verification/owner-program-pg${{ matrix.pg }}-${{ matrix.baseline }}/*.png
            verification/release-chromium-157.0.8098.0/installation.json
          retention-days: 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.baseline == 'published107'
        with:
          name: municipal-owner-program-pg${{ matrix.pg }}-${{ matrix.baseline }}-${{ github.sha }}
          path: |
            verification/owner-program-pg${{ matrix.pg }}-${{ matrix.baseline }}/
            verification/release-chromium-157.0.8098.0/installation.json
            scripts/migrations/200-own-payroll-report-census.sql
            scripts/lib/owner190-canonical-cleanup.mjs
            scripts/lib/owner190-cleanup-profile.mjs
            tests/owner190-cleanup-profile.test.js
            tests/owner190-cleanup-raw255.local.test.js
            scripts/lib/own-payroll-report-census-installation.mjs
            scripts/lib/own-payroll-report-census-authority.mjs
            scripts/lib/own-payroll-report-census-ledger.mjs
            scripts/lib/own-payroll-report-census-190-continuation.mjs
            scripts/lib/own-payroll-report-census-067-runtime-fixture.mjs
            tests/fixtures/own-payroll-report-census-legacy-synthetic.js
            tests/fixtures/own-payroll-report-census-program-synthetic.js
            tests/own-payroll-report-census-program-synthetic.test.js
            scripts/lib/own-payroll-report-census-190-iam-fixture.mjs
            scripts/lib/own-payroll-report-census-qa-rpc.mjs
            scripts/verify-own-payroll-report-census.mjs
            tests/own-payroll-report-census-qa-rpc.test.js
            tests/own-payroll-report-census-190-iam-fixture.test.js
            tests/own-payroll-report-census-190-legacy.test.js
            tests/own-payroll-report-census-workflow.test.js
          retention-days: 5
